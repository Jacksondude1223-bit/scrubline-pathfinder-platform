name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    name: Rust build and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build release binaries
        run: cargo build --locked --release --bins
      - name: Native process integration
        env:
          PATHFINDER_BIN_DIR: target/release
        run: python3 scripts/runtime-e2e.py
      - name: All CLI commands
        run: python3 scripts/rust-cli-e2e.py
  snapshot:
    name: Vercel Rust snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Snapshot source matches
        # git diff ignores untracked files, so a module added to src/ but never committed to the
        # snapshot would pass here and break the Vercel build.
        run: |
          sh vercel-test/sync.sh
          drift=$(git status --porcelain -- vercel-test/src vercel-test/Cargo.toml vercel-test/rust-toolchain.toml)
          if [ -n "$drift" ]; then echo "$drift"; git diff -- vercel-test; exit 1; fi
      - name: Snapshot format and lint
        run: |
          cargo fmt --manifest-path vercel-test/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path vercel-test/Cargo.toml --all-targets -- -D warnings
      - name: Snapshot behavior
        run: cargo test --locked --manifest-path vercel-test/Cargo.toml
      - name: Build Vercel adapter
        run: cargo build --locked --release --manifest-path vercel-test/Cargo.toml
  spec:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install --disable-pip-version-check --quiet PyYAML
      - run: python3 scripts/spec-check.py
  containers:
    name: Rust container fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start fabric
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml up --build -d
      - name: Check control plane and nodes
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:9091/health && curl -fsS http://127.0.0.1:9092/health && curl -fsS http://127.0.0.1:9093/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml logs api node-a node-b node-c
      - name: Clean up
        if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml down -v
  installer:
    name: Install script under systemd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Lint
        run: shellcheck -s bash scripts/install.sh
      # The control plane and a scrubbing node on one server, built by the script itself, the way
      # a first install runs; the runner has systemd, which the units' sandboxing is checked by.
      - name: Install
        run: sudo scripts/install.sh all --listen 127.0.0.1:18443 --region ci
      - name: Check what it started
        run: |
          systemctl is-active scrubline-api scrubline-node scrubline-provision
          curl -fsS --cacert /etc/scrubline/tls/ca.pem https://127.0.0.1:18443/health
          sudo scrubline-ctl nodes | grep -q '"region":"ci"'
          # The provisioner loads the node's tunnel firewall within a pass or two.
          for attempt in $(seq 1 30); do
            if sudo nft list table inet scrubline | grep -q 'meta l4proto'; then exit 0; fi
            sleep 1
          done
          sudo nft list ruleset
          exit 1
      - name: Upgrade in place
        run: |
          token=$(sudo sed -n 's/^SCRUBLINE_API_TOKEN=//p' /etc/scrubline/api.env)
          sudo scripts/install.sh all
          test "$token" = "$(sudo sed -n 's/^SCRUBLINE_API_TOKEN=//p' /etc/scrubline/api.env)"
          systemctl is-active scrubline-api scrubline-node scrubline-provision
      - name: Logs on failure
        if: failure()
        run: sudo journalctl --no-pager -u scrubline-api -u scrubline-node -u scrubline-provision
      - name: Remove
        run: |
          sudo scripts/install.sh uninstall --purge
          if systemctl is-active --quiet scrubline-api; then exit 1; fi
          if sudo nft list table inet scrubline >/dev/null 2>&1; then exit 1; fi
          if id scrubline >/dev/null 2>&1; then exit 1; fi

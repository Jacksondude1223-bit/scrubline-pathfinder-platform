[package]
name = "scrubline-pathfinder"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "pathfinder"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

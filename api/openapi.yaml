openapi: 3.0.3
info:
  title: Scrubline Cloud control plane
  version: 0.2.0
  description: 'Control plane for the distributed scrubbing fabric. The drop path is ASIC/TCAM ACLs, FPGA
    meters and a PF_RING ZC userspace inspect path; it is not XDP.


    ## Credentials


    Three bearer credentials, three blast radii. A scrubbing node sits at the edge in someone else''s
    datacentre, so it never holds one that can change the fabric.


    | Credential | Held by | Reaches |

    | --- | --- | --- |

    | `operatorToken` | operators, `scrubctl` | everything |

    | `enrollToken` | node agents | `POST /v1/nodes/register`, and nothing else |

    | `nodeToken` | one scrubber | its own heartbeat, program and counters, plus `GET /v1/ml/model` |

    | `tenantToken` | one protected customer | `GET /v1/analytics/*`, for their own prefixes only |


    A node credential is issued at registration, scoped to that node, 256 bits, stored only as a hash
    and rotated whenever the node enrols again. An unset credential never matches: an empty token is a
    misconfiguration, not a way to open the control plane.


    Anything a credential is not allowed to reach answers `403`, not `404`.


    ## Analytics


    A customer buys protection for a prefix, not for a node, so everything under `/v1/analytics` is keyed
    by prefix and summed across the fabric. History is bucketed by the minute, kept for a day, and held
    in memory: it is derived from reports that keep arriving, so a restarted control plane rebuilds it
    within a couple of heartbeats rather than carrying stale numbers across the gap.


    Nodes report cumulative counters and the control plane deltas them. That is deliberate: a counter
    that only counts up survives a report being missed, and one that goes backwards is read as a node
    that restarted rather than as negative traffic.


    ## Transport


    Both binaries serve TLS and refuse to serve a routable address without it. Clients verify against
    the system roots or a private CA; verification is never disabled.


    ## Replicas


    A replica answers every read and refuses every write with `409`. Two control planes accepting writes
    would compile conflicting announcement plans and flap the fabric''s BGP.


    ## Durability


    A write is durable before it is acknowledged. If the state cannot be written the change is rolled
    back and the call answers `503` — a caller is never told a policy was saved that the control plane
    will forget.'
  license:
    name: See repository
servers:
- url: https://127.0.0.1:8080
  description: A control plane serving TLS
- url: http://127.0.0.1:8080
  description: Loopback without TLS, which is the only address allowed to
tags:
- name: Operations
  description: Liveness and metrics.
- name: Nodes
  description: Enrolment, liveness and what each scrubber installs.
- name: Policy
  description: Protected prefixes, stage rules, steering, game filters, and compiling them across the
    fabric.
- name: Tunnels
  description: 'Customer return tunnels: the address each scrubbing node terminates them on, and
    adding, changing and switching them off node by node on the deployed policy.'
- name: Classifier
  description: The flow-level model the ZC stage scores with.
- name: Analytics
  description: 'What a protected customer sees: their own traffic, what was scrubbed out of it, and the
    attacks they have been under. Also the customer records and credentials behind that view.'
- name: Replication
  description: Following a primary, and taking over from one.
security: &id001
- operatorToken: []
paths:
  /health:
    get:
      summary: Liveness, and which mode this control plane is in
      tags:
      - Operations
      security: []
      description: 'Open: no credential. It carries no policy detail.'
      responses:
        '503':
          description: A request failed so badly that the control-plane state can no longer be used. Restart the process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The control plane is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      summary: Prometheus exposition for the control plane and the reporting fleet
      tags:
      - Operations
      security: *id001
      responses:
        '200':
          description: Exposition in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Only GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The exposition could not be rendered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: No bearer credential, or one the control plane does not know.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: The credential is valid but not allowed here. The body says which credential the
            endpoint needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Node series are built from the counters each node attached to its heartbeat. The exposition
        names every node, its load and its rule hits, so a node credential cannot read it.
  /v1/state:
    get:
      summary: The durable control-plane state a replica follows
      tags:
      - Replication
      security: *id001
      responses:
        '200':
          description: The current durable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401': *id002
        '403': *id003
      description: Carries every policy and every node credential hash, so it is reachable only with the
        operator credential. A replica polls this and writes what it gets through to its own state file.
  /v1/promote:
    post:
      summary: Turn a replica into the primary
      tags:
      - Replication
      security: *id001
      responses:
        '200':
          description: Promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - primary
        '409':
          description: This control plane is already the primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: Deliberate, and one way. Promoting while the old primary still lives gives two control
        planes compiling conflicting announcement plans, so fence the old one first. Nothing reachable
        from a replica can tell a dead primary from an unreachable one, which is why this is not automatic.
  /v1/nodes/register:
    post:
      summary: Register a node, and issue the credential scoped to it
      tags:
      - Nodes
      security:
      - enrollToken: []
      - operatorToken: []
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '400':
          description: Missing name, or a field that will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A different live node already holds this name and region, another node holds the
            tunnel_src (by an operator's assignment, or by registration while it is live), or this control
            plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: A credential could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Registration is also credential issue. The token in the response is returned once
        and never served again; re-registering rotates it and the previous one stops working immediately.


        Node ids derive from name and region, so two scrubbers sharing both collapse onto one identity.
        A registration that would take over a node that is still live, from a different advertise address,
        is refused with 409; once the incumbent has aged out a replacement may take the identity.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
  /v1/nodes:
    get:
      summary: List the fleet
      tags:
      - Nodes
      security: *id001
      responses:
        '200':
          description: Every registered node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '401': *id002
        '403': *id003
      description: 'Status is derived from the last heartbeat: a node past its TTL reads stale and is
        withdrawn from anycast.'
  /v1/nodes/{id}/heartbeat:
    post:
      summary: Keep a node live, and report its datapath counters
      tags:
      - Nodes
      security: &id004
      - nodeToken: []
      - operatorToken: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: The body was present but malformed, or reported the same tunnel twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The control plane does not know this node. Enrol again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id006
          description: This control plane is a replica and does not accept writes. Send them to the primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'A node may heartbeat only for itself. The body is optional; an agent that sends none
        still heartbeats. Counters are keyed to the node the path names and labelled from the record the
        control plane already holds, so a report cannot claim to be another node.


        `tunnels` is what this node''s provisioner says about its return paths. It rides the heartbeat
        rather than having an endpoint of its own because it has to arrive as often as liveness does:
        a tunnel that went down between two polls is a prefix being black-holed until the next one. A
        tunnel reported down withdraws its prefixes from this node immediately, and the fabric recompiles
        on the change rather than waiting for the next scheduled pass.


        A `tunnels` list, even an empty one, is everything the provisioner says now and replaces what
        it said before; leaving the field out keeps it. Reports on a tunnel an operator has just
        disabled, rebuilt, removed or moved to another address are ignored until the node next fetches
        its program, since until then its agent is reporting on the tunnel as it was.'
      parameters: &id005
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stats:
                  $ref: '#/components/schemas/Stats'
                tunnels:
                  type: array
                  items:
                    $ref: '#/components/schemas/TunnelStatus'
  /v1/nodes/{id}/program:
    get:
      summary: What a node installs
      tags:
      - Nodes
      security: *id004
      responses:
        '200':
          description: The compiled program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          description: A wait that is not a duration, or a since that is not an RFC 3339 time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No program has been deployed for this node yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: A program names the prefixes a node scrubs and what it announces, so a node may fetch
        only its own. With wait, the request is held while the node's program is still the one compiled
        at since (or, with since empty, while it has none) until the fabric compiles it a new one, which
        differs in more than compiled_at, or wait runs out, then answered with the program as it stands. A node keeps one such request open instead
        of polling, so what the control plane decides reaches it at once.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: since
        in: query
        required: false
        description: The compiled_at of the program the node holds; empty for a node that holds none.
        schema:
          type: string
          format: date-time
      - name: wait
        in: query
        required: false
        description: How long to hold the request for a new program, as a duration such as 20s. At most
          30s; without it the program is answered at once.
        schema:
          type: string
  /v1/nodes/{id}/stats:
    get:
      summary: The counters a node last reported
      tags:
      - Nodes
      security: *id004
      responses:
        '200':
          description: The last report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: This node has reported no counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      parameters: *id005
  /v1/policies:
    get:
      summary: List policies
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: Every policy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '401': *id002
        '403': *id003
    post:
      summary: Create or replace a policy
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: A field will not validate, or a tunnel allocated to a customer names an unknown
            one or carries a prefix outside theirs. The message names the offending item and why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': &id007
          description: Durable state could not be written. The change was rolled back and did not take
            effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Saving does not deploy; POST the deploy endpoint for that. An id that already exists
        is replaced and its version bumped.


        Everything is validated here rather than on fifty scrubbers: CIDRs, ports, rule and filter ids,
        steering regions and communities, and the game filters are compiled. A policy carrying game filters
        is issued a challenge secret, shared across the fabric so a cookie minted by one node verifies
        on another.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
  /v1/policies/{id}/deploy:
    post:
      summary: Compile a policy across the fabric
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: Deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResult'
        '404':
          description: No such policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No live nodes to deploy onto, a tunnel is pinned to a node outside the steering
            regions of one of its prefixes, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Compiles the ASIC, FPGA and ZC programs and the BGP announcement plan, and stores
        them. Agents pick their program up on their next poll.


        The plan covers every registered node, not only the live ones: a node that stopped answering needs
        an explicit withdrawal, and one that comes back finds its program already compiled.'
      parameters: *id005
  /v1/fabric:
    get:
      summary: The BGP announcement plan and the compiled programs
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: The current fabric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fabric'
        '401': *id002
        '403': *id003
  /v1/ml/samples:
    get:
      summary: The labelled training set
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: Every stored sample.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
        '401': *id002
        '403': *id003
    post:
      summary: Add labelled flow records
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored:
                    type: integer
        '400':
          description: A sample will not validate. The message names the index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The batch would push the training set past its limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  stored:
                    type: integer
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'The whole batch is refused on the first bad record: one out-of-range field would otherwise
        train a model whose weights are all NaN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleBatch'
  /v1/ml/train:
    post:
      summary: Fit the ZC classifier
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: The fitted model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModel'
        '400':
          description: Fewer than two samples, a malformed body, a limit outside 0 to 1, or a fit that
            diverged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The fit drops more of the clean samples than the limit allows, or a known-good
            sample, and was not published. The published model stays.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - model
                properties:
                  error:
                    type: string
                    example: 'not published: the flow model drops 4.2% of the clean samples it was measured
                      on, over the 1.0% limit'
                  model:
                    $ref: '#/components/schemas/MLModel'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'An absent body takes the defaults; a malformed one is an error rather than something
        to ignore.


        One sample in five is held out of the fit and the reported metrics are measured on that holdout.
        Sets below ten samples are too small to split and report training metrics with validation 0.


        A fit that would drop more than max_false_positive_rate of the clean samples it is measured on,
        or any known-good sample, is not published unless force is set.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainRequest'
  /v1/ml/model:
    get:
      summary: The published model weights
      tags:
      - Classifier
      security:
      - nodeToken: []
      - operatorToken: []
      responses:
        '200':
          description: The current model. ready is false when none has been fitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModel'
        '401': *id002
        '403': *id003
      description: Every node installs this, so a node credential may read it. It carries weights, not
        policy or fleet detail.
    delete:
      summary: Retire the published model
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModel'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: Agents clear their installed copy on the next poll. Without this a bad model could
        only be removed by restarting every agent in the fleet.
  /v1/ml/score:
    post:
      summary: Score one flow without running the hardware stages
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: The score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
                  label:
                    type: integer
                    enum:
                    - 0
                    - 1
                  ready:
                    type: boolean
                  http:
                    type: object
                    description: Present when the flow carries HTTP requests, which the request model
                      scores one by one, as the layer-7 rules would hand them to it.
                    properties:
                      ready:
                        type: boolean
                      scores:
                        type: array
                        items:
                          type: number
                      score:
                        type: number
                        description: The highest.
                      label:
                        type: integer
                        enum:
                        - 0
                        - 1
        '400':
          description: The flow will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Flow'
  /v1/decide:
    post:
      summary: Run a flow record through a node's pipeline
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: The flow will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No program is deployed for that node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Evaluates against the program deployed to that node, in the real pipeline. Useful
        for asking what a policy would do before trusting it.


        The flow may carry a base64 payload. Without one the game filter reports the packet uninspectable
        and never drops it, because it refuses to judge what it was not given. Rate state accumulates
        across calls, so repeated calls can trip a behavioural cap.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
  /v1/analytics/overview:
    get:
      summary: How each protected prefix is doing
      tags:
      - Analytics
      security: &id008
      - tenantToken: []
      - operatorToken: []
      responses:
        '200':
          description: The current view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: The window will not parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'The customer-facing view: one row per protected prefix, summed across the whole fabric
        rather than reported per node. A customer does not have a node, they have a prefix, and under
        anycast it is carried by every scrubber at once.


        A tenant credential sees only the prefixes it is entitled to, and an entitlement nothing has reported
        for yet comes back reading zero rather than being left out — an empty page is indistinguishable
        from an outage.'
      parameters:
      - &id009
        name: window
        in: query
        required: false
        schema:
          type: string
          default: 24h
        description: How far back to report, as a duration (15m, 6h, 24h). Clamped to the retention horizon.
          A value that will not parse is refused rather than silently answering a different question.
  /v1/analytics/series:
    get:
      summary: One prefix's traffic over time
      tags:
      - Analytics
      security: *id008
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          description: No prefix, or a window or step that will not parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Each point reports the heaviest moment inside it rather than an average over it, because
        an average is what a burst attack is shaped to hide.


        A prefix the credential is not entitled to answers 403 whether or not it exists: a customer must
        not be able to map the platform''s other customers by watching which prefixes answer differently.'
      parameters:
      - name: prefix
        in: query
        required: true
        schema:
          type: string
        example: 203.0.113.0/24
        description: Must be one the credential is entitled to.
      - *id009
      - name: step
        in: query
        required: false
        schema:
          type: string
        description: Interval per point. Rounded up to the resolution, and defaulted to about 120 points
          across the window. Points are aligned to the step, so two reads of the same dashboard line up.
  /v1/analytics/events:
    get:
      summary: The attacks a prefix has been under
      tags:
      - Analytics
      security: *id008
      responses:
        '200':
          description: The attack log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEvents'
        '400':
          description: The window will not parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Newest first. Each attack names the rules and filters that stopped it, because "you
        were attacked" on its own is not something a customer can act on.


        An attack is opened when a meaningful share of a prefix''s traffic is being scrubbed, or when
        the burst detector recognises a pulse train. It is not closed on the first quiet moment: a burst
        train is quiet between bursts by design, and closing early would record one attack as fifty.'
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          type: string
        description: One prefix. Omit for every prefix the credential can see.
      - *id009
  /v1/tenants:
    get:
      summary: List customers
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: Every customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '401': *id002
        '403': *id003
      description: 'Entitlements, not credentials: a credential''s plaintext is returned once at issue
        and never kept.'
    post:
      summary: Create or replace a customer
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Missing name, no prefixes, or a prefix that will not parse or is not masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The change would leave a tunnel allocated to this customer carrying a prefix outside
            their prefixes, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Saving does not issue a credential; POST the token endpoint for that. An id that already
        exists is replaced, which is how entitlements are changed.


        Prefixes must be written masked. The entitlement is matched against what was written, so one with
        host bits set would authorize differently than it reads.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant'
  /v1/tenants/{id}/token:
    post:
      summary: Issue or rotate a customer's credential
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: The credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCredential'
        '404':
          description: Unknown customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: Returned once and never served again. Only the hash is kept, so a lost credential is
        rotated rather than recovered, and issuing again invalidates the previous one immediately.
      parameters: *id005
  /v1/tenants/{id}:
    delete:
      summary: Offboard a customer
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '404':
          description: Unknown customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A tunnel is still allocated to this customer (the message names it), or this control
            plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: Takes the credential with it. One that outlived its tenant would authenticate to an
        empty entitlement rather than to nothing. A customer with a tunnel allocated is refused until the
        tunnel is deleted or reallocated.
      parameters: *id005
  /v1/nodes/{id}/tunnel-endpoint:
    put:
      summary: Assign the address a node's tunnels terminate on
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Assigned, and the fabric recompiled with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointNode'
        '400':
          description: The address is not IPv4, is not one a customer edge could reach (unspecified,
            loopback, multicast or broadcast), is the customer end of a deployed tunnel, or lies inside a
            protected prefix, which the fabric anycasts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another node holds that address (by an operator's assignment, or by registration
            while it is live), or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Makes this node''s own address the local end of every customer tunnel it builds,
        so each customer''s GRE tunnel runs straight to the scrubbing node that carries its prefixes. The
        same address is what the node peers customer BGP sessions from.


        The assignment is the operator''s: it overrides the tunnel_src the node registered with, and survives
        the node re-registering, so a node cannot move its own tunnels. It reaches the agent in its program;
        registration answers with what the node registered. Two nodes may not share an address, since each
        would take the other''s customer replies; a node that has stopped heartbeating keeps an assigned
        address but not one it registered with, so a replacement box can take that over. Prefixes withdrawn
        because the node had no endpoint are announced again on the recompile this triggers, and what was
        reported about its tunnels from the old address is dropped, so a required tunnel reports up again.


        Scrubline does not configure the address on the box: it must already be one the node owns and that
        is routed to it. Agents must be on a release that reads the endpoint from their program before one
        is assigned, or they keep peering customer sessions from the address they started with.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TunnelEndpoint'
    delete:
      summary: Return a node to the tunnel endpoint it registered with
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Cleared, and the fabric recompiled without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointNode'
        '404':
          description: No such node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The address the node registered with now belongs to another node, so falling back
            to it would put two nodes on one address; assign this one another address instead. Or this
            control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: The node falls back to its own registered tunnel_src. A node that registered without
        one has no endpoint afterwards, and withdraws every prefix that has a return path.
      parameters: *id005
  /v1/tunnels:
    get:
      summary: Every return tunnel of the deployed policy, node by node
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: The deployed policy's tunnels. A control plane with nothing deployed answers with
            a null policy_id and no tunnels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelFleet'
        '401': *id002
        '403': *id003
      description: For each tunnel, every node that carries any of its prefixes, with the address the
        tunnel terminates on there, whether it is enabled on that node, its share of the clean-traffic
        allowance, what the node's provisioner last reported, and which of its prefixes the fabric is
        announcing or withdrawing from that node and why. A row with a problem is a node that is not
        delivering those prefixes.
      parameters:
      - name: tenant
        in: query
        required: false
        schema:
          type: string
        description: Only the tunnels allocated to this customer (tenant id).
  /v1/tunnels/{id}:
    put:
      summary: Create or replace a tunnel in the deployed policy
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: The tunnel will not validate against the policy (including a rate_mbps over 2500,
            or the same encapsulation, remote and key as another tunnel), names an unknown customer or
            carries a prefix outside theirs, lists a disabled entry that is not a registered node id, names
            a node that is not a registered node id or is outside the steering regions of one of the
            tunnel's prefixes, or the id in the body differs from the one in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Tunnels belong to the deployed policy, so a change here bumps its version, is validated
        with the whole policy, and is compiled onto the fabric straight away: no separate deploy. The body
        replaces the tunnel whole, including its disabled list and rate; the id comes from the path.


        To allocate a tunnel to a customer, set tenant. Its prefixes must then lie within that customer''s
        prefixes; leave prefixes out and it carries the protected prefixes that are the customer''s
        own, not those of a customer nested inside them that covers a prefix more specifically, and
        that no other tunnel already carries.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tunnel'
    delete:
      summary: Remove a tunnel from the deployed policy
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Removed as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelDeleted'
        '404':
          description: The deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: Its prefixes no longer have a return path, so the nodes carrying them announce them
        without one, as they would a prefix that never had a tunnel.
      parameters: *id005
  /v1/tunnels/{id}/disable:
    post:
      summary: Take a tunnel down on some nodes
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: The body names no nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such node, or the deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'The named nodes stop building the tunnel and withdraw its prefixes, since they would
        have no way to deliver what they attracted; the rest of the fabric keeps carrying them. For maintenance
        on one site''s path, or taking a misbehaving one out without touching the others.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeSelection'
  /v1/tunnels/{id}/enable:
    post:
      summary: Bring a tunnel back on some nodes
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: The body names no nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such node, or the deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: Undoes disable for the named nodes. Naming a node the tunnel was never disabled on
        is not an error.
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeSelection'
  /v1/tunnels/{id}/rate:
    put:
      summary: Set how much clean traffic a tunnel may carry
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: rate_mbps is missing, negative or over 2500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Changes only the tunnel''s clean-traffic allowance, leaving the rest of it as it is.
        The allowance is the total the customer receives: a pinned tunnel''s location shapes all of it,
        and a fanned-out tunnel gives each node sending it an even share to shape to.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TunnelRate'
  /v1/tunnels/{id}/mitigation:
    put:
      summary: Choose whether a tunnel is filtered always or only once an attack starts
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: An unknown mitigation, a negative threshold, or a threshold without on_demand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: Changes only the tunnel's mitigation and its thresholds, leaving the rest of it as it is.
        Thresholds left out take their defaults.
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TunnelMitigation'
  /v1/tunnels/{id}/location:
    put:
      summary: Pin a tunnel to the node the customer's one tunnel ends on
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed. Naming the node the
            tunnel is already at changes nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: node is missing, is not a registered node id, or is outside the steering regions
            of one of the tunnel's prefixes, so it could never announce that prefix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'For a panel offering customers a choice of location. That node builds the customer''s
        GRE tunnel from its tunnel endpoint, so the customer configures one tunnel, to that address, and
        alone announces their prefixes until it is overloaded or down; the other nodes then announce
        them too and forward what they scrub to it over node-to-node GRE. Moving a tunnel rebuilds it,
        so what was reported about it at its old and new location is dropped. An empty node fans it out
        to every node carrying its prefixes again.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TunnelLocation'
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: Full control-plane access. SCRUBLINE_API_TOKEN.
    enrollToken:
      type: http
      scheme: bearer
      description: Registers a node and collects its credential. Nothing else. SCRUBLINE_ENROLL_TOKEN.
    nodeToken:
      type: http
      scheme: bearer
      description: Issued at registration, scoped to one node.
    tenantToken:
      type: http
      scheme: bearer
      description: 'Issued to a customer, scoped to the prefixes they are entitled to. Read-only, and
        the narrowest credential the platform issues: it cannot see the fleet, the policy behind the protection,
        or another customer''s traffic.'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: What went wrong, in a sentence an operator can act on.
    Match:
      type: object
      description: Which packets a rule applies to. Every field is optional; an empty match applies to
        everything the stage sees.
      properties:
        src_cidr:
          type: string
          example: 198.51.100.0/24
        dst_cidr:
          type: string
          example: 203.0.113.0/24
        proto:
          type: string
          enum:
          - tcp
          - udp
          - icmp
          - any
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        sport:
          type: integer
          minimum: 0
          maximum: 65535
        tcp_flags:
          type: string
          example: syn
    Rule:
      type: object
      required:
      - id
      - stage
      - action
      properties:
        id:
          type: string
          description: 'Unique within the policy. Must not contain ''|'': rule ids key the per-source
            rate table.'
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
          description: asic is TCAM ACLs, fpga is line-rate meters, zc is the userspace inspect path.
            Only zc sees payload.
        action:
          type: string
          enum:
          - drop
          - permit
          - rate_limit
          - inspect
          - count
          description: drop and permit are terminal. count is observe-only and never drops. rate_limit
            meters. inspect hands the flow to the ZC path.
        match:
          $ref: '#/components/schemas/Match'
        pps:
          type: integer
          minimum: 0
          description: Only an fpga rate_limit, and a zc rate_limit or inspect, consume this. Set anywhere
            else the policy is refused rather than the value silently ignored.
        priority:
          type: integer
          description: First match decides, on every stage. Equal priorities keep policy order.
        comment:
          type: string
    Steering:
      type: object
      required:
      - prefix
      properties:
        prefix:
          type: string
          description: Must be one of the policy's protected prefixes.
        regions:
          type: array
          items:
            type: string
          description: A hard boundary. A node outside these neither announces the prefix nor inspects
            traffic for it.
        communities:
          type: array
          items:
            type: string
          description: 'BGP communities to attach. Validated here because agents write them into a routing
            daemon: only ASN:value, ASN:value:value, or a well-known name.'
    GameMagic:
      type: object
      required:
      - offset
      - hex
      properties:
        offset:
          type: integer
          minimum: 0
        hex:
          type: string
          example: deadbeef
          description: Bytes that must appear at offset.
    GameSignature:
      type: object
      description: A protocol described in the policy, for a game the platform ships no profile for.
      properties:
        min_len:
          type: integer
          minimum: 0
        max_len:
          type: integer
          minimum: 0
        packet_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Allowed first byte. Empty allows any.
        magic:
          type: array
          items:
            $ref: '#/components/schemas/GameMagic'
        gate:
          type: string
          enum:
          - none
          - handshake
          description: 'A challenge gate cannot be described here: answering one means emitting protocol-correct
            bytes, and a wrong guess breaks every client rather than failing closed.'
        opener_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Packet ids an unadmitted source may send.
        complete_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Packet ids that finish the handshake and admit the source. Required with a handshake
            gate.
    GameHttpPath:
      type: object
      description: A rule for one path, or every path under a prefix. Set exactly one of path and prefix.
        Paths match after percent-decoding, with backslashes read as slashes, runs of slashes and dot
        segments resolved, and without regard to case. A request takes the rule with its exact path,
        else the one with the longest prefix it starts with. Anything a rule leaves unset comes from
        the block.
      properties:
        path:
          type: string
          example: /players.json
        prefix:
          type: string
          example: /files/
        action:
          type: string
          enum:
          - allow
          - drop
          description: drop refuses every request the rule covers, and then takes none of the other
            settings.
        methods:
          type: array
          items:
            type: string
        user_agents:
          type: array
          items:
            type: string
          description: Prefixes one of which a request's User-Agent must start with, in any case. The
            header has to be in the segment that starts the request.
        rate_per_source:
          type: integer
          minimum: 0
          description: Requests a second one source may make on this rule, over the last second. None at
            zero; the block's own limit applies on top.
        rate_total:
          type: integer
          minimum: 0
          description: Requests a second this rule takes from every source together, counting each
            request that got past its source's own rates. Over it, a request from a source the fabric
            has not verified (one that cleared a gate, answered a challenge or had its return traffic
            confirmed in the last five minutes) is dropped, and one from a verified source passes.
            Such a drop is no strike against the source. None at zero; the block's own budget applies
            on top.
        max_body_bytes:
          type: integer
          minimum: 0
          description: The largest Content-Length allowed; a chunked body is refused under a limit.
            Zero takes the block's.
    GameHttp:
      type: object
      description: 'Layer-7 rules for the HTTP a game server answers on its own address: TCP to the filter''s
        dst_cidr, on its dport or on ports when set. A request is judged in the segment carrying its
        request line, whether at the segment''s start, pipelined behind another or after a line break
        in a segment that continues a body; the rest of a request, TLS and other protocols pass. A
        malformed request, one with folded headers, disagreeing Content-Length headers or a
        Content-Length beside Transfer-Encoding, a request line cut short in a short segment, and
        cleartext HTTP/2 by preface or upgrade are dropped.'
      properties:
        ports:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
          description: TCP ports to judge. Empty takes the filter's dport, or every port when it has none.
        methods:
          type: array
          items:
            type: string
          description: Methods allowed. GET, HEAD and POST when empty.
        user_agents:
          type: array
          items:
            type: string
          description: Prefixes one of which a request's User-Agent must start with. Any client when empty.
        rate_per_source:
          type: integer
          minimum: 0
          description: Requests a second one source may make across every path. No limit at zero.
        rate_total:
          type: integer
          minimum: 0
          description: Requests a second the filter takes from every source together, across every
            path. Over it, only sources the fabric has verified get through, as for a path's
            rate_total. No budget at zero.
        max_body_bytes:
          type: integer
          minimum: 0
          description: The largest Content-Length allowed. No limit at zero.
        default:
          type: string
          enum:
          - allow
          - drop
          description: What a path no rule names gets. drop makes the rules an allow list.
        paths:
          type: array
          items:
            $ref: '#/components/schemas/GameHttpPath'
    GameFilter:
      type: object
      required:
      - id
      description: Admits traffic to a game port only if it looks like that game, and holds the HTTP the
        server answers on the same address to rules. Bound to a port on a protected address, not to a
        game the platform knows about.
      properties:
        id:
          type: string
          description: Unique within the policy. Must not contain '|'.
        dst_cidr:
          type: string
        proto:
          type: string
          enum:
          - tcp
          - udp
          - any
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        profile:
          type: string
          enum:
          - raknet
          - a2s
          description: A built-in protocol. Omit when custom describes one inline; setting both is refused.
            A filter with http rules may carry neither, and then judges only its HTTP. On TCP the http rules
            take their ports, so a tcp profile on the same port is refused.
        custom:
          $ref: '#/components/schemas/GameSignature'
        http:
          $ref: '#/components/schemas/GameHttp'
        observe:
          type: boolean
          description: Record what the filter would have done without acting on it.
        comment:
          type: string
    Policy:
      type: object
      required:
      - name
      - protected
      properties:
        id:
          type: string
          description: Assigned on save when omitted.
        name:
          type: string
        protected:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: Network prefixes with no host bits set, each naming a different network. A speaker
            refuses a route with host bits, so such a prefix would never be announced.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        steering:
          type: array
          items:
            $ref: '#/components/schemas/Steering'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameFilter'
        reputation:
          $ref: '#/components/schemas/ReputationPolicy'
        egress:
          $ref: '#/components/schemas/EgressPolicy'
        ml:
          $ref: '#/components/schemas/MlPolicy'
        crafted:
          $ref: '#/components/schemas/CraftedPolicy'
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/Tunnel'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        pulse_floor_pps:
          type: integer
          minimum: 0
          description: 'How loud a burst must be to count toward a burst train. Shape alone cannot decide
            it: a sparse trickle has the same crest factor and duty cycle as an attack. Zero takes the
            platform default.'
        challenge_secret:
          type: string
          description: Generated on save when the policy carries game filters, and shipped to every node
            so a cookie minted by one scrubber verifies on another.
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Bumped on every save of the same id.
    Node:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
        capacity_gbps:
          type: number
          minimum: 0
          description: Weights AS-path prepends against the rest of the fabric.
        capacity_pps:
          type: integer
          minimum: 0
          description: Packet-rate ceiling load-driven shedding measures against. A node that declares
            none is never padded for load.
        backends:
          type: array
          items:
            type: string
            enum:
            - asic
            - fpga
            - zc
          description: Stages this node can install. Empty means full-stack.
        advertise:
          type: string
          description: Address peers reach this node on; its host becomes the BGP next hop.
        tunnel_src:
          type: string
          example: 192.0.2.1
          description: 'Local address this node builds customer return tunnels from, and peers customer
            sessions from. Per node rather than per tunnel because the fabric is anycast: every node carrying
            a prefix needs its own tunnel to the one customer endpoint, and they cannot share a source.
            A node without one is withdrawn from any prefix that has a return path, rather than attracting
            traffic it could not deliver. An operator''s assignment through PUT /v1/nodes/{id}/tunnel-endpoint
            takes the place of the registered value and survives re-registration.'
        last_seen:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ready
          - stale
    RegistrationResult:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/Node'
        token:
          type: string
          description: The credential issued to this node, scoped to it. Returned once, here, and never
            served again. Re-registering rotates it and the previous one stops working immediately.
    Announcement:
      type: object
      properties:
        prefix:
          type: string
        node_id:
          type: string
        node_name:
          type: string
        region:
          type: string
        state:
          type: string
          enum:
          - announce
          - withdraw
        prepends:
          type: integer
          description: AS-path padding. Higher means the node is a less attractive path and takes less
            of the prefix's traffic.
        communities:
          type: array
          items:
            type: string
        next_hop:
          type: string
          description: The address the node announces its routes towards. The text form leaves it off
            a route of the other address family, which a peer without extended next hops would refuse.
        reason:
          type: string
    ACLEntry:
      type: object
      properties:
        priority:
          type: integer
        action:
          type: string
        match:
          $ref: '#/components/schemas/Match'
        rule_id:
          type: string
        tcam_key:
          type: string
          description: The rule as a TCAM entry. The first word is the table it belongs in, v4 or v6 by
            the addresses it matches, or any for a rule matching no address, which a switch installs
            in both.
    FPGAEntry:
      type: object
      properties:
        table:
          type: string
        priority:
          type: integer
        match:
          $ref: '#/components/schemas/Match'
        meter_pps:
          type: integer
        action:
          type: string
        rule_id:
          type: string
    ZCEntry:
      type: object
      properties:
        cluster:
          type: string
        priority:
          type: integer
        match:
          $ref: '#/components/schemas/Match'
        action:
          type: string
        pps:
          type: integer
        rule_id:
          type: string
    Program:
      type: object
      description: What one node installs. Compiled from the policy and the live node set.
      properties:
        node_id:
          type: string
        policy_id:
          type: string
        version:
          type: integer
        prefixes:
          type: array
          items:
            type: string
          description: 'Prefixes this node enforces policy on, including ones it is currently withdrawing:
            BGP takes time to converge and traffic still arriving should be scrubbed.'
        asic:
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
        fpga:
          type: array
          items:
            $ref: '#/components/schemas/FPGAEntry'
        zc:
          type: array
          items:
            $ref: '#/components/schemas/ZCEntry'
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameFilter'
        challenge_secret:
          type: string
        pulse_floor_pps:
          type: integer
        reputation:
          $ref: '#/components/schemas/ReputationPolicy'
        egress:
          $ref: '#/components/schemas/EgressPolicy'
        ml:
          $ref: '#/components/schemas/MlPolicy'
        crafted:
          $ref: '#/components/schemas/CraftedPolicy'
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/NodeTunnel'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        compiled_at:
          type: string
          format: date-time
          description: Changes on every recompile, including one that reassigns prefixes without bumping
            the policy version. Agents key their reload on it.
        tunnel_src:
          type: string
          description: The tunnel endpoint the control plane holds for this node, which an operator may
            have assigned since it registered. The agent peers customer sessions from it.
        backhaul:
          type: array
          items:
            $ref: '#/components/schemas/Backhaul'
          description: Node-to-node tunnels for pinned customers, to their locations and from the nodes that
            may help this one.
        pinned:
          type: array
          items:
            type: string
          description: Prefixes of the customers pinned to this node, which is all that traffic arriving over
            a node-to-node tunnel may be addressed to.
        tunnel_peers:
          type: array
          items:
            type: string
          description: Every address this node accepts GRE and IPIP from, the other nodes' tunnel endpoints
            and the customer end of each tunnel it builds. Compiled from the fabric, so a node that joins is
            accepted everywhere on the next compile.
    Flow:
      type: object
      description: One flow record.
      properties:
        src_ip:
          type: string
        dst_ip:
          type: string
        proto:
          type: string
          example: udp
          description: tcp, udp or icmp. Read from a packet, also gre, esp, ah, sctp, or the protocol's
            number.
        sport:
          type: integer
          minimum: 0
          maximum: 65535
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        flags:
          type: string
          example: syn,ack
          description: TCP flag names (fin, syn, rst, psh, ack, urg, ece, cwr, ns) separated by ',', '|'
            or '+', or none for a segment with none set. Empty means the record does not say. Rules
            compare them as sets, so syn meets a SYN with ECN or PSH set too, and never a SYN-ACK.
        pps:
          type: integer
          minimum: 0
          description: The flow's observed packet rate; 1 by default for a record that carries a packet.
        bps:
          type: integer
          minimum: 0
          description: The flow's observed bit rate, when the record carries one. Without it a node counts
            the packets' headers and the payload, for an on-demand tunnel's bandwidth threshold.
        payload:
          type: string
          format: byte
          description: 'Packet bytes, base64. Only the ZC stage sees it. Without one the game filter reports
            the packet uninspectable and never drops it: it refuses to judge what it was not given. In a
            training sample, an HTTP request here makes it a sample for the request model.'
        packet:
          type: string
          format: byte
          description: 'The whole packet, base64, from its IP header (IPv4 or IPv6) on, as it arrived:
            for a datapath that hands the node packets rather than flow records. The node reads the
            addresses, protocol, ports, flags and payload from its headers, which take the place of the
            fields above, and holds it to the rules those headers state before anything else judges it
            (see crafted packets in the README). Only what the headers declare may be in it, and at most
            64 bytes of a link''s padding past them, so a capture cut short reads as a packet that lies
            about its length.'
    Decision:
      type: object
      properties:
        action:
          type: string
          enum:
          - drop
          - permit
          - rate_limit
          - inspect
          - count
          - challenge
          description: challenge means this packet is dropped and reply is emitted to the source.
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
        rule_id:
          type: string
        reason:
          type: string
        node_id:
          type: string
        score:
          type: number
          description: Classifier score, when the ZC model decided.
        filter:
          type: string
          description: The game filter that decided, when one did.
        check:
          type: string
          description: The crafted-packet check a packet broke, when one dropped it, as the reason says in
            words. Its class is the reason's first word in brackets.
          enum:
          - land
          - tcp_flags
          - martian_source
          - source_route
          - low_mss
          - fragment_overlap
          - ip_header
          - ip_options
          - extension_headers
          - tcp_header
          - udp_header
          - icmp
          - port_zero
          - fragment
          - length
          - oversize
          - tiny_fragment
        reply:
          type: string
          format: byte
          description: Bytes the datapath sends back to the source. Set only on a challenge.
    MLModel:
      type: object
      properties:
        weights:
          type: array
          items:
            type: number
        bias:
          type: number
        threshold:
          type: number
        epochs:
          type: integer
        loss:
          type: number
        accuracy:
          type: number
          description: Measured on the holdout, not on the samples the model was fitted on.
        precision:
          type: number
          description: 'On the holdout. Watch this one: a false positive here is dropped customer traffic.'
        recall:
          type: number
          description: On the holdout.
        false_positive_rate:
          type: number
          description: Of the clean samples it was measured on, the holdout's, the share it drops.
            Training refuses a model over its limit, 0.01 unless the request sets another.
        max_cut:
          type: number
          description: How far under its threshold a node may hold it for a target being probed. 0.2 or 0.1
            when it still drops no more of the clean samples than the limit there, and no known-good
            sample; otherwise 0, and the model never tightens. A model published before this was measured
            has 0.
        validation:
          type: integer
          description: Samples held out of the fit. Zero means the set was too small to split.
        samples:
          type: integer
        ready:
          type: boolean
        withdrawn:
          type: boolean
          description: Set by DELETE /v1/ml/model. Agents clear their copy when they see it; the zero
            model cannot signal this because it is indistinguishable from never trained.
        http:
          description: The request model, fitted to the samples whose payload is an HTTP request, which
            are left out of the flow model's fit. Its samples and validation count requests, and every
            fifth HTTP sample is held out with all the requests in it. Absent until the training set
            holds clean and attack HTTP samples both.
          allOf:
          - $ref: '#/components/schemas/MLModel'
    Sample:
      type: object
      required:
      - flow
      - label
      properties:
        flow:
          $ref: '#/components/schemas/Flow'
        label:
          type: integer
          enum:
          - 0
          - 1
          description: 0 clean, 1 attack. A TCP flow whose payload is an HTTP request trains the request
            model; any other trains the flow model.
        known_good:
          type: boolean
          description: A clean sample the models must never drop, such as a false positive that was
            reported. Training refuses a model that drops one, at its threshold, and holds max_cut where
            none would be dropped. Only with label 0.
    StageStats:
      type: object
      properties:
        stage:
          type: string
        dropped:
          type: integer
        permitted:
          type: integer
        pps_dropped:
          type: integer
        pps_permitted:
          type: integer
    RuleStats:
      type: object
      properties:
        rule_id:
          type: string
        stage:
          type: string
        matches:
          type: integer
        drops:
          type: integer
        pps_seen:
          type: integer
        pps_dropped:
          type: integer
    GameStats:
      type: object
      properties:
        filter_id:
          type: string
        profile:
          type: string
        inspected:
          type: integer
        dropped:
          type: integer
        challenged:
          type: integer
        uninspectable:
          type: integer
          description: Packets the filter was given no payload for. It never drops on these, so a rising
            value means the datapath is not supplying payloads and the filter is doing nothing.
        pps_dropped:
          type: integer
        http_requests:
          type: integer
          description: HTTP requests the filter's layer-7 rules judged.
        http_dropped:
          type: integer
          description: HTTP requests those rules dropped, for any reason.
        http_rate_limited:
          type: integer
          description: HTTP requests dropped because their source went over a rate, or because everyone
            together went over a budget and their source was not verified.
        http_other:
          type: integer
          description: Segments on the HTTP ports that started no request (the rest of one, TLS, another
            protocol). They pass.
        http_budget_dropped:
          type: integer
          description: Segments dropped because everyone together went over a rate_total and their source
            held no proof. Counted in http_rate_limited too.
    PrefixStats:
      type: object
      description: 'Everything one node knows about the traffic aimed at one protected prefix. Reported
        per prefix rather than per node because that is the unit a customer buys: a scrubber carries many
        prefixes, so its own totals say nothing about whether any particular one was attacked.'
      properties:
        prefix:
          type: string
        flows:
          type: integer
          description: Decisions for this prefix. Cumulative since the node started carrying it; the control
            plane deltas these, and a counter that only counts up survives a report being missed.
        flows_dropped:
          type: integer
          description: Of those, dropped or challenged. Cumulative.
        offered:
          type: integer
          description: Sum of the per-flow rates reported on flows arriving for this prefix. A volume
            weighting of the flow count, not a packet counter. Cumulative.
        dropped:
          type: integer
          description: The same weighting over the flows that were scrubbed. Cumulative.
        offered_pps:
          type: integer
          description: Moving average over the node's load window, not a total.
        dropped_pps:
          type: integer
          description: Moving average over the node's load window, not a total.
        pulsing:
          type: boolean
          description: True while a burst train is recognised, including through the quiet stretches between
            bursts.
        peak_pps:
          type: integer
        mean_pps:
          type: integer
        crest:
          type: number
          description: Peak over mean. Steady traffic sits near one however heavy it is.
        duty_cycle:
          type: number
        bursts:
          type: integer
        held_for_seconds:
          type: number
        ml_cut:
          type: number
          description: How far under their published thresholds the classifiers drop for this prefix,
            because what they scored for it gathered just under them. 0, 0.1 or 0.2; each step lapses
            five minutes after the probing that set it was last seen.
        crafted:
          type: array
          description: What the crafted-packet checks dropped for this prefix, per class, once they have
            dropped any. Absent until then.
          items:
            $ref: '#/components/schemas/PrefixCrafted'
    PrefixCrafted:
      type: object
      properties:
        class:
          type: string
          enum:
          - stack
          - protocol
          - buffer
        flows:
          type: integer
        dropped:
          type: integer
          description: The packets of those flows, as their rates add up.
    CraftedStats:
      type: object
      description: What the crafted-packet checks did on this node, in all and per check, and how full
        its table of fragments in reassembly is.
      properties:
        mode:
          type: string
          enum:
          - enforce
          - observe
          - 'off'
        dropped:
          type: integer
        observed:
          type: integer
          description: What the checks caught and let through because the policy only observes.
        fragments:
          type: integer
          description: Fragmented datagrams being tracked for overlapping fragments.
        fragments_max:
          type: integer
          description: The most tracked at once. At the bound the oldest is forgotten.
        fragments_untracked:
          type: integer
          description: Datagrams forgotten before their 30 seconds to make room, and fragments past the 64
            one datagram keeps.
        checks:
          type: array
          description: Every check, always, in a fixed order.
          items:
            $ref: '#/components/schemas/CheckStats'
    CheckStats:
      type: object
      properties:
        check:
          type: string
        class:
          type: string
          enum:
          - stack
          - protocol
          - buffer
          description: stack, built to crash or wedge the receiving stack; protocol, breaking the rules of
            the protocol it claims to be; buffer, sized to overrun a buffer or a reassembly table.
        dropped:
          type: integer
        observed:
          type: integer
    MitigationStats:
      type: object
      description: An on-demand tunnel as the node holding it sees it.
      properties:
        tunnel_id:
          type: string
        active:
          type: boolean
          description: Whether it is being mitigated, from when its traffic reached a threshold until it has
            stayed under both for the wave's hold.
        since:
          type: string
          format: date-time
          nullable: true
          description: When the current mitigation started; null while idle.
        pps:
          type: integer
          description: Packets a second reaching the tunnel's prefixes over the last second.
        bps:
          type: integer
          description: Bits a second, likewise.
        attack_pps:
          type: integer
          description: This node's packet-rate threshold.
        attack_bps:
          type: integer
          description: This node's bandwidth threshold, in bit/s.
        wave:
          type: integer
          description: Which wave of an attack the last mitigation was. 1 for one that started more than
            an hour after the last one ended, and one more for each that started sooner. 0 before any.
        hold_seconds:
          type: integer
          description: How long the traffic has to stay under both thresholds before that wave's
            mitigation ends. 300 for the first wave, doubling with each after it, up to 3600.
        mitigations:
          type: integer
          description: Mitigations started.
        unfiltered:
          type: integer
          description: Flows let through unfiltered while the tunnel was idle.
    MLStats:
      type: object
      description: ready to passes and observed are the flow model's; the http_ fields are the request
        model's.
      properties:
        ready:
          type: boolean
        scored:
          type: integer
        drops:
          type: integer
        passes:
          type: integer
        observed:
          type: integer
          description: Flows scored at or above the threshold and let through, because the policy has the
            models observe.
        http_ready:
          type: boolean
        http_scored:
          type: integer
          description: Requests the HTTP rules allowed that the request model scored.
        http_drops:
          type: integer
          description: Segments dropped because the request model scored a request in them at or above
            its threshold.
        http_observed:
          type: integer
          description: Segments it would have dropped, let through because the policy or the filter
            observes.
        scope:
          type: string
          enum:
          - all
          - inspect
        mode:
          type: string
          enum:
          - enforce
          - observe
        probing:
          type: string
          enum:
          - tighten
          - ignore
        near_misses:
          type: integer
          description: Flows either model scored within 0.1 under the threshold in force for their
            prefix.
        tightened:
          type: integer
          description: Times a prefix's thresholds were lowered a step because near misses made up a
            quarter or more of what the models scored for it.
    Stats:
      type: object
      description: A node's datapath counters. Most are monotonic totals; the fields documented as rates
        are moving averages.
      properties:
        decisions:
          type: integer
        unowned:
          type: integer
          description: Flows for a prefix this node does not carry. A rising value means the steering
            layer and the fabric disagree about who scrubs what.
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageStats'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleStats'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameStats'
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/PrefixStats'
        ml:
          $ref: '#/components/schemas/MLStats'
        pulsing:
          type: boolean
        pulse_peak_pps:
          type: integer
        game_sessions:
          type: integer
        game_sessions_max:
          type: integer
        game_http_windows:
          type: integer
          description: Pairs of HTTP rule and source the request-rate limits are tracking.
        game_http_windows_max:
          type: integer
          description: Bound on that table. At the bound a new source goes unlimited rather than another
            being forgotten.
        reputation:
          $ref: '#/components/schemas/ReputationStats'
        egress:
          $ref: '#/components/schemas/EgressStats'
        rate_buckets:
          type: integer
        rate_buckets_max:
          type: integer
        offered_pps:
          type: integer
          description: Moving average over load_window_seconds, not a total.
        dropped_pps:
          type: integer
          description: Moving average over load_window_seconds, not a total.
        surge_pps:
          type: integer
          description: The offered rate over the last second. Load-driven shedding goes by the higher of
            this and offered_pps, so it moves within a second of a flood arriving.
        load_window_seconds:
          type: integer
        crafted:
          $ref: '#/components/schemas/CraftedStats'
        mitigation:
          type: array
          nullable: true
          description: The on-demand tunnels this node holds. Null when it holds none.
          items:
            $ref: '#/components/schemas/MitigationStats'
    Report:
      type: object
      properties:
        node_id:
          type: string
        name:
          type: string
        region:
          type: string
        stats:
          $ref: '#/components/schemas/Stats'
        reported_at:
          type: string
          format: date-time
    Fabric:
      type: object
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        ml:
          $ref: '#/components/schemas/MLModel'
    Snapshot:
      type: object
      description: 'The durable control-plane state a replica follows. Liveness, derived state and reported
        counters are deliberately absent: they are either worthless across a restart or recompiled from
        the policy.'
      properties:
        version:
          type: integer
        saved_at:
          type: string
          format: date-time
        seq:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        node_tokens:
          type: object
          additionalProperties:
            type: string
          description: Node id to credential hash. Hashes only; a dump of this hands nobody a working
            credential.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        last_policy_id:
          type: string
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
        model:
          $ref: '#/components/schemas/MLModel'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        tenant_tokens:
          type: object
          additionalProperties:
            type: string
          description: Tenant id to credential hash. Hashes only, for the same reason node_tokens are.
        tunnel_endpoints:
          type: object
          additionalProperties:
            type: string
          description: 'Node id to the tunnel endpoint an operator assigned it, which overrides the node''s
            registered tunnel_src. A control plane from before this field drops it, so replicas are
            upgraded before the primary they follow.'
    ReputationPolicy:
      type: object
      description: 'Tunes the two-tier source cache: who gets the short path, and whether repeat offenders
        are dropped at the top of the pipeline.'
      properties:
        fast_pass:
          type: string
          enum:
          - challenge
          - egress
          - handshake
          - 'off'
          description: 'The weakest proof that earns the short path. Defaults to challenge, the stricter
            reading: answering one means echoing a value that could only have come from a reply to that
            address, so the address answers for itself, while a handshake can be sent blind and a spoofer
            can clear it for any address. Widening to handshake is reasonable for a protocol that defines
            no challenge, and is a deliberate decision rather than a default.'
        penalty_box:
          type: boolean
          description: 'Drop sources that keep failing, at the top of the pipeline, rather than letting
            them walk every stage to the same verdict. Off by default: it is an escalation of consequence
            beyond what one packet earned. With it off, strikes and would-be demotions are still counted
            and exposed, which is how it is sized before being switched on.'
    CraftedPolicy:
      type: object
      description: What a node does with a packet built to harm the stack that receives it rather than
        to swamp it, one that breaks a rule its own headers state. The checks run on every node for every
        protected prefix, an idle on-demand tunnel's included, before anything else judges the packet,
        and no permit or verified source exempts one.
      properties:
        mode:
          type: string
          enum:
          - enforce
          - observe
          - 'off'
          description: enforce, the default, drops it. observe counts what would be dropped and drops
            nothing. off does not look.
    MlPolicy:
      type: object
      description: Where the published classifiers judge traffic, and whether they drop what they score
        at their threshold. A drop by either counts against the source like any other.
      properties:
        scope:
          type: string
          enum:
          - all
          - inspect
          description: 'all, the default: the flow model scores every flow the stages let through (what
            a zc inspect or rate_limit rule sends it, what a game filter passes, and what no rule decides),
            and the request model every request a filter''s HTTP rules allow. An asic or fpga permit rule
            skips both; a zc one, which comes after the game filters, and a verified source skip the flow
            model. inspect: only the flows zc inspect and rate_limit rules send the flow model, and the
            request model off.'
        mode:
          type: string
          enum:
          - enforce
          - observe
          description: enforce, the default, drops what a model scores at its threshold. observe scores
            and counts it, and drops nothing, which is how a model is tried before it is trusted.
        probing:
          type: string
          enum:
          - tighten
          - ignore
          description: 'tighten, the default: traffic tuned to get past a model scores just under its
            threshold, so when near misses (within 0.1 under the threshold in force) are 20 or more,
            and a quarter or more of what the models scored for a protected prefix over the last ten
            seconds, both models drop 0.1 lower for that prefix, and 0.2 lower if it happens again
            there, each no further than its max_cut. Each step lapses five minutes after the probing
            that set it was last seen. ignore keeps the thresholds where they are.'
    EgressPolicy:
      type: object
      description: What the fabric does with the return path it can see. Watching what the origin sends
        back is the one confirmation that needs no protocol knowledge — whatever the service speaks, if
        it is answering an address at length it considers that address a client — and the only signal
        here an attacker cannot forge from the ingress side.
      properties:
        lockdown:
          type: string
          enum:
          - 'off'
          - limit
          - drop
          description: 'What happens to an unconfirmed source while a prefix is under a recognised attack.
            Off by default: under lockdown a client that has proved nothing is held back, and a brand-new
            legitimate client has by definition proved nothing yet, so this trades joinability during
            an attack for a protocol-agnostic filter. limit holds it to a trickle; drop silences it. Never
            applies to a prefix whose return path is not visible.'
        lockdown_pps:
          type: integer
          minimum: 0
          description: The cap an unconfirmed source is held to in limit mode. Zero takes the platform
            default.
        grace_millis:
          type: integer
          minimum: 0
          description: 'How long a source this node has not seen before is left alone under lockdown.
            Zero takes the platform default of 500ms. Without it lockdown cannot be escaped: a new client
            is unconfirmed, so it is held back, so its packets never reach the origin, so the origin never
            answers, so it is never confirmed.'
    EgressPrefixState:
      type: object
      properties:
        prefix:
          type: string
        visibility:
          type: string
          enum:
          - visible
          - asymmetric
          - unknown
          description: asymmetric means this prefix carries ingress but no replies come back through this
            node — direct server return, or the node is off the return path. Everything depending on return
            traffic stands down for it, because reading an absence of replies as 'nobody is confirmed'
            would hold back every real client.
        clients:
          type: integer
        confirmed:
          type: integer
    EgressStats:
      type: object
      description: The return-path picture one node holds.
      properties:
        prefixes:
          type: integer
        clients:
          type: integer
        clients_max:
          type: integer
        confirmed:
          type: integer
        promotions:
          type: integer
        full:
          type: integer
        asymmetric:
          type: integer
          description: Prefixes whose return path is not visible here.
        seen:
          type: integer
          description: Replies observed travelling back through this node.
        promoted:
          type: integer
        locked_down:
          type: integer
          description: Ingress held back for want of a confirmation.
        lockdown:
          type: string
          enum:
          - 'off'
          - limit
          - drop
        prefix_states:
          type: array
          items:
            $ref: '#/components/schemas/EgressPrefixState'
    ReputationStats:
      type: object
      description: The two-tier source cache's counters.
      properties:
        tracked:
          type: integer
        max:
          type: integer
          description: At the bound a source takes the ordinary path, so this costs an optimisation rather
            than a protection.
        trusted:
          type: integer
        penalised:
          type: integer
        fast_passed:
          type: integer
          description: Packets taken off the slow path because their source was already verified.
        boxed:
          type: integer
          description: 'Packets dropped at the top because their source is in the box: the load the rest
            of the stages did not carry.'
        promotions:
          type: integer
        demotions:
          type: integer
        strikes:
          type: integer
        shielded:
          type: integer
          description: Strikes that landed on an already-verified source and were not acted on. Source
            addresses are attacker-controlled, so acting on one would let anyone get a real player banned.
            A rising value is a spoofing attempt or a misbehaving verified client, and both want a human.
        full:
          type: integer
        freed:
          type: integer
          description: Boxed sources released because their address answered for itself, the origin
            replying to them at length or a challenge answered. Each was a penalty cutting off a real
            client.
    Tunnel:
      type: object
      required:
      - remote
      description: 'The return path for a set of protected prefixes: where scrubbed traffic goes once
        it is clean. This is the half of a scrubbing service BGP cannot do — announcing a prefix pulls
        the traffic in, and it then cannot be routed back the ordinary way, because as far as the internet
        is concerned the scrubbers are that prefix now. One Tunnel describes one customer endpoint; the
        fabric is anycast, so it compiles to one tunnel per node carrying the prefixes, all to the same
        remote.'
      properties:
        id:
          type: string
          example: northwind
          description: 'Required in a policy; on PUT /v1/tunnels/{id} it comes from the path. Becomes an
            interface name, so it is lowercase letters, digits and dashes, and at most 11 characters: the kernel truncates a name over its limit rather than refusing it,
            and two tunnels truncating to one name is one tunnel.'
        prefixes:
          type: array
          items:
            type: string
          description: Which protected prefixes ride this tunnel; at least one, though PUT /v1/tunnels/{id}
            fills them in from the tenant when it is allocated to one. Each must be one the policy protects,
            and a prefix belongs to at most one tunnel — backup paths are not modelled, so two would leave
            no answer to which return path is authoritative.
        type:
          type: string
          enum:
          - gre
          - ipip
          description: GRE unless the customer's edge cannot do it. ipip is lighter but carries no key,
            so it cannot demultiplex several tunnels between the same pair of addresses, and it carries IPv4
            only, so a tunnel with an IPv6 prefix must be GRE.
        remote:
          type: string
          example: 198.51.100.1
          description: 'The customer''s tunnel endpoint. The local end is each node''s own tunnel_src. Two
            tunnels of one encapsulation to the same remote need distinct keys, since Linux holds one tunnel
            per remote and key.
            IPv4 only: the MTU arithmetic here is IPv4''s, and a v6 endpoint would compile a tunnel wrong
            by twenty bytes.'
        mtu:
          type: integer
          description: 'Zero derives it from a 1500-byte path less this encapsulation''s overhead: 1476
            for GRE, 1472 with a key, 1480 for ipip. A value that does not fit is refused with the one
            that does.'
        mss_clamp:
          type: integer
          description: TCP MSS to clamp inbound traffic to. Zero derives it from the MTU, 40 bytes below
            it, or 60 when the tunnel carries an IPv6 prefix, since the clamp rewrites both families. Without clamping,
            a customer whose path drops the ICMP that path-MTU discovery needs sees TCP complete its handshake
            and then hang — the classic way a working tunnel still looks broken.
        key:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Demultiplexes several GRE tunnels between the same two addresses. Not available
            on ipip, and costs four bytes of MTU.
        required:
          type: boolean
          description: 'Makes a confirmed-up tunnel a precondition for announcing these prefixes from
            a node. Off by default: a fabric whose provisioner reports nothing would otherwise announce
            nothing at all and give no hint why. On, for operators whose tunnels report reliably and who
            would rather drop traffic than black-hole it.'
        direction:
          type: string
          enum:
          - both
          - return
          default: both
          description: 'both: clean traffic goes down the tunnel to the customer and the customer''s
            replies come back up it to the node, which forwards them to the internet. Replies are accepted
            only from the tunnel''s own prefixes, so the tunnel cannot relay anything else the customer
            edge sends into it. return: the tunnel carries clean traffic out only, replies leave the
            customer by its own transit, and nothing that comes up the tunnel is forwarded.'
        disabled:
          type: array
          items:
            type: string
          description: Node ids that must not build this tunnel. They withdraw its prefixes instead of
            attracting traffic they have no path to deliver. Set through the disable and enable endpoints;
            on PUT /v1/tunnels/{id} each must be a registered node id.
        tenant:
          type: string
          description: The customer (tenant id) this tunnel is allocated to. Its prefixes must lie within
            that customer's prefixes, and the customer cannot be deleted, or lose those prefixes, while
            it is allocated.
        rate_mbps:
          type: integer
          minimum: 0
          maximum: 2500
          description: 'Clean traffic the customer receives down this tunnel, in Mbit/s, in total. A pinned
            tunnel''s location shapes all of it; a fanned-out tunnel gives every node sending it an even
            share to shape to. Zero, or leaving it out, takes the maximum of 2500 (2.5 Gbit/s), so no tunnel
            is ever unlimited.'
        node:
          type: string
          example: node-20c0e739603a7b60
          description: 'The node the customer''s tunnel ends on: the location chosen for them, so they hold
            one tunnel. It alone announces the prefixes until it passes 80% of its capacity_pps or stops
            heartbeating; then the other nodes carrying them announce them too, and forward what they scrub
            to it over node-to-node GRE. Help holds for five minutes after it was last measured overloaded.
            On PUT /v1/tunnels/{id}, a registered node id. Empty fans the tunnel out: every node carrying
            the prefixes holds its own tunnel to the customer and announces them.'
        mitigation:
          type: string
          enum:
          - always
          - on_demand
          description: 'always, the default: every node filters the customer''s traffic all the time.
            on_demand: each node holding the tunnel only watches the traffic to its prefixes until it reaches
            attack_pps or attack_mbps over the last second, then applies its whole policy to it until the
            traffic has stayed under both for five minutes, or for longer when the attack keeps coming
            back: each mitigation that starts within an hour of the last one ending holds twice as long
            as that one did, up to an hour. A game filter''s HTTP rules, and the request
            model behind them, judge it throughout. A node helping a pinned tunnel''s location holds no
            tunnel for it, so it watches nothing and filters from the first packet. While idle nothing else
            is filtered, so an attack under the thresholds passes.'
        attack_pps:
          type: integer
          minimum: 0
          description: Packets a second to the tunnel's prefixes that start its mitigation, in total, split
            across a fanned-out tunnel's nodes the way rate_mbps is. Zero takes the packet rate attack_mbps
            is at 512-byte packets. Only with on_demand; set otherwise, the tunnel is refused.
        attack_mbps:
          type: integer
          minimum: 0
          description: Mbit/s to the tunnel's prefixes that start its mitigation, likewise. Zero takes half
            the clean-traffic allowance. Only with on_demand.
        comment:
          type: string
    Session:
      type: object
      required:
      - id
      - peer_ip
      - peer_as
      - prefixes
      description: 'A BGP peering with a customer, for customers who announce their own prefixes rather
        than having them typed into a policy. What the session may carry is still declared here: a route
        learned from a customer does not add itself to the protected set, or a peer that leaked a supernet
        would have the fabric announcing address space it was never asked to protect.'
      properties:
        id:
          type: string
          description: Lowercase letters, digits, dashes and underscores. Becomes the peering's name in
            the rendered configuration, with dashes folded to underscores, so two ids that differ only
            in that are refused.
        peer_ip:
          type: string
          description: IPv4. The session peers from the node's IPv4 tunnel_src.
          example: 198.51.100.1
        peer_as:
          type: integer
          minimum: 1
          maximum: 4294967295
        local_as:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The AS the fabric peers from. Zero takes the node's own; a session with neither
            is refused rather than coming up announcing from whatever the daemon happened to hold.
        prefixes:
          type: array
          items:
            type: string
          minItems: 1
          description: What the session accepts, each one an IPv4 prefix the policy protects, since the
            rendered configuration carries an ipv4 channel only. The rendered filter admits
            these and anything more specific inside them, because customers de-aggregate under attack
            and a filter that refused that would drop the announcement when it mattered most.
        max_prefixes:
          type: integer
          minimum: 0
          description: Tears the session down past this many accepted routes. Zero derives a limit with
            headroom over the filter — a backstop against a leak, not an inventory.
        password:
          type: string
          description: 'TCP-MD5 secret, shipped only to the nodes terminating this session. Printable
            ASCII without spaces, quotes or backslashes: it is written into a routing daemon''s configuration,
            so a value that could close its string is refused rather than quoted.'
        multihop:
          type: integer
          minimum: 0
          maximum: 255
          description: TTL for a peer that is not directly attached.
        passive:
          type: boolean
          description: Wait for the customer to connect rather than dialling them.
        nodes:
          type: array
          items:
            type: string
          description: Node ids or names that terminate this session.
        regions:
          type: array
          items:
            type: string
          description: 'Regions that terminate it. Empty nodes and regions means every node, which is
            rarely wanted: a customer peers where they have a path, not with the whole fabric.'
        comment:
          type: string
    NodeTunnel:
      type: object
      description: One node's instance of a policy Tunnel, with the local end filled in and the derived
        values resolved, so the agent renders configuration rather than recomputing policy.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - gre
          - ipip
        local:
          type: string
          description: This node's tunnel_src.
        remote:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: The tunnel's prefixes that this node actually carries.
        mtu:
          type: integer
        mss_clamp:
          type: integer
        key:
          type: integer
        required:
          type: boolean
        interface:
          type: string
          example: scr-northwind
          description: The link name this compiles to, inside the kernel's 15-character limit.
        comment:
          type: string
        direction:
          type: string
          enum:
          - both
          - return
          description: Empty means both.
        sources:
          type: array
          items:
            type: string
          description: Every prefix of the tunnel, including ones steered away from this node. Replies coming
            back up the tunnel may be sourced from any of them.
        foreign:
          type: array
          items:
            type: string
          description: Other tunnels' prefixes inside this tunnel's, across the whole policy. Each is that
            customer's, as routing goes by the most specific prefix, so replies up this tunnel may not be
            sourced from it.
        rate_kbps:
          type: integer
          description: This node's share of the tunnel's clean-traffic allowance, in kbit/s. The allowance
            is split evenly across the nodes announcing the tunnel's prefixes; a node still building it
            while withdrawing gets the same share for the traffic BGP has yet to move away, and with no
            node announcing, the live nodes building it split it.
        mitigation:
          type: string
          enum:
          - on_demand
          description: Present when the node only watches the tunnel's traffic until it reaches attack_pps
            or attack_kbps, a game filter's HTTP rules apart. Absent, it filters it always.
        attack_pps:
          type: integer
          description: This node's share of the tunnel's packet-rate threshold, split like rate_kbps.
        attack_kbps:
          type: integer
          description: This node's share of the tunnel's bandwidth threshold, in kbit/s.
    TunnelEndpoint:
      type: object
      required:
      - address
      properties:
        address:
          type: string
          example: 192.0.2.1
          description: 'The node''s own IPv4 address, reachable from customer edges: the local end of
            its GRE tunnels.'
    EndpointNode:
      description: A node as the fabric uses it, with the tunnel endpoint in force.
      allOf:
      - $ref: '#/components/schemas/Node'
      - type: object
        properties:
          tunnel_endpoint_assigned:
            type: boolean
            description: Whether tunnel_src is an operator's assignment rather than what the node registered
              with.
    NodeSelection:
      type: object
      required:
      - nodes
      properties:
        nodes:
          type: array
          minItems: 1
          items:
            type: string
          description: Node ids.
    TunnelLocation:
      type: object
      required:
      - node
      properties:
        node:
          type: string
          example: node-20c0e739603a7b60
          description: A node id from GET /v1/nodes, or empty to fan the tunnel out.
    TunnelRate:
      type: object
      required:
      - rate_mbps
      properties:
        rate_mbps:
          type: integer
          minimum: 0
          maximum: 2500
          example: 1000
          description: Mbit/s. Zero takes the maximum, 2500 (2.5 Gbit/s).
    TunnelMitigation:
      type: object
      required:
      - mitigation
      properties:
        mitigation:
          type: string
          enum:
          - always
          - on_demand
        attack_pps:
          type: integer
          minimum: 0
        attack_mbps:
          type: integer
          minimum: 0
    TunnelChange:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
          description: The deployed policy's version after the change.
        tunnel:
          $ref: '#/components/schemas/Tunnel'
    TunnelDeleted:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
        deleted:
          type: string
          description: The tunnel id removed.
    TunnelFleet:
      type: object
      properties:
        policy_id:
          type: string
          nullable: true
        version:
          type: integer
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/TunnelOverview'
    TunnelOverview:
      type: object
      description: A policy Tunnel with its defaults resolved, and how it stands on each node.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - gre
          - ipip
        direction:
          type: string
          enum:
          - both
          - return
        remote:
          type: string
        key:
          type: integer
        prefixes:
          type: array
          items:
            type: string
        required:
          type: boolean
        disabled:
          type: array
          items:
            type: string
        tenant:
          type: string
          description: The customer it is allocated to. Empty when it is not.
        rate_mbps:
          type: integer
          description: The allowance in force, with the default resolved.
        mitigation:
          type: string
          enum:
          - always
          - on_demand
        attack_pps:
          type: integer
          nullable: true
          description: The thresholds in force for an on-demand tunnel, with the defaults resolved, in total.
            Null when it is mitigated always.
        attack_mbps:
          type: integer
          nullable: true
        node:
          type: string
          description: The node it is pinned to. Empty when it fans out.
        location:
          type: string
          nullable: true
          description: That node's name, or null when it is not a registered node.
        overflow:
          type: boolean
          description: Whether the other nodes are announcing its prefixes, the location being overloaded
            or down.
        comment:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TunnelNode'
    TunnelNode:
      type: object
      description: One node carrying some of a tunnel's prefixes.
      properties:
        role:
          type: string
          enum:
          - location
          - helper
          - member
          description: 'location: a pinned tunnel''s node, which builds the customer''s tunnel. helper:
            another node carrying a pinned tunnel''s prefixes, which forwards to the location over its
            interface here. member: a node of a fanned-out tunnel.'
        standing_by:
          type: boolean
          description: For a helper, whether it is waiting for the location to need it rather than
            announcing. Standing by is not a problem.
        node_id:
          type: string
        name:
          type: string
        region:
          type: string
        status:
          type: string
          enum:
          - ready
          - stale
        endpoint:
          type: string
          description: The local end of this node's tunnel. Empty when it has none.
        endpoint_assigned:
          type: boolean
          description: Whether the endpoint is an operator's assignment.
        enabled:
          type: boolean
        state:
          type: string
          enum:
          - up
          - down
          - unknown
          - unreported
          description: What the node's provisioner last reported.
        reported_at:
          type: string
          format: date-time
        prefixes:
          type: array
          items:
            type: string
          description: The tunnel's prefixes this node carries.
        announced:
          type: array
          items:
            type: string
        withdrawn:
          type: array
          items:
            type: object
            properties:
              prefix:
                type: string
              reason:
                type: string
        interface:
          type: string
        mtu:
          type: integer
        mss_clamp:
          type: integer
        rate_kbps:
          type: integer
          description: This node's share of the allowance, as last compiled. Absent when the node does
            not build the tunnel.
        mitigating:
          type: boolean
          description: For an on-demand tunnel, whether this node, which holds it, was mitigating it when
            it last reported. A node reports the moment a mitigation starts. Absent on a node that does not
            watch the tunnel.
        mitigating_since:
          type: string
          format: date-time
          description: When the mitigation started, while it lasts.
        mitigation_wave:
          type: integer
          description: Which wave of an attack the mitigation is, while it lasts. 1, or one more than
            the last when that ended less than an hour before this one started.
        mitigation_hold_seconds:
          type: integer
          description: How long the traffic has to stay under both thresholds before this mitigation
            ends. 300 for a first wave, doubling with each after it, up to 3600.
        ingress_pps:
          type: integer
          description: What reached the tunnel's prefixes on this node over the second before it reported.
        ingress_bps:
          type: integer
        problem:
          type: string
          description: Why this node is not delivering the tunnel's prefixes, when it is not. A configuration
            problem (disabled here, no endpoint) when there is one, otherwise the reason the plan gives for
            withdrawing the first of them, such as the tunnel being reported down.
    Backhaul:
      type: object
      description: A node-to-node GRE tunnel. A node helping another with a customer pinned there forwards
        the clean traffic it scrubs over one, and the location receives it on its end.
      properties:
        peer:
          type: string
          description: The node at the other end.
        interface:
          type: string
          example: sbh-b981c02c78d
          description: sbh- and a digest of the peer's id.
        local:
          type: string
        remote:
          type: string
        mtu:
          type: integer
        mss_clamp:
          type: integer
        prefixes:
          type: array
          items:
            type: string
          description: What is routed into it, the prefixes pinned at the peer that this node carries.
            Empty on the location's end, which only receives.
    TunnelStatus:
      type: object
      required:
      - tunnel_id
      - state
      description: What a node's provisioner says about one return path. Nodes attach these to the heartbeat
        they already send, because a tunnel that went down between two polls is a prefix being black-holed
        until the next one.
      properties:
        tunnel_id:
          type: string
        state:
          type: string
          enum:
          - up
          - down
          - unknown
          description: 'A tunnel reported down withdraws its prefixes from that node. One that has never
            reported does not: absence of a report usually means nothing is reporting, and inferring failure
            from silence would blank the fabric of any operator who has not wired a provisioner up yet.
            Set required on the tunnel to reverse that judgement.'
        detail:
          type: string
          description: Free text from the provisioner, carried through unchanged.
        reported_at:
          type: string
          format: date-time
          description: 'Stamped by the control plane, not the node: the fleet''s clocks are not synchronised.'
    Tenant:
      type: object
      required:
      - name
      - prefixes
      description: A customer of the scrubbing service. It exists so a customer can be given a credential
        that reads their own traffic and nothing else; without it the only way to show someone their analytics
        is to hand them an operator token, which also reads every other customer's prefixes, the fleet's
        topology and the policy behind it.
      properties:
        id:
          type: string
          description: Derived from the name when omitted, so re-sending the same customer updates them
            rather than creating a second record holding half their prefixes.
        name:
          type: string
        prefixes:
          type: array
          items:
            type: string
          minItems: 1
          description: 'What this customer may read. An entitlement covers anything inside it, so a customer
            who brings a /22 and has it protected as four /24s is entitled once rather than on every split.
            Must be written masked: host bits are refused, because the entitlement is matched against
            what was written.'
        contact:
          type: string
          description: Free text for whoever runs the platform. Never matched on.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCredential:
      type: object
      properties:
        tenant_id:
          type: string
        token:
          type: string
          description: Returned once, here, and never served again. Only its hash is kept, so a lost credential
            is rotated rather than recovered; issuing again rotates it and the previous one stops working
            immediately.
    AnalyticsVector:
      type: object
      description: One way traffic was stopped during an attack.
      properties:
        rule_id:
          type: string
        filter_id:
          type: string
        crafted:
          type: string
          enum:
          - stack
          - protocol
          - buffer
          description: The class of crafted packets the checks dropped, for a vector that is neither a rule
            nor a filter. It has no stage.
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
        shared:
          type: boolean
          description: The rule guards the whole policy rather than this prefix specifically, so its volume
            is not necessarily this customer's.
        flows:
          type: integer
        dropped:
          type: integer
    AnalyticsEvent:
      type: object
      description: One attack against one prefix.
      properties:
        prefix:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the attack is still running. Dated to when the traffic stopped, not
            to the end of the window spent confirming it.
        ongoing:
          type: boolean
        seconds:
          type: number
        peak_pps:
          type: integer
          description: Summed across the fleet. The bursts need not be simultaneous, so this is an upper
            bound on the instantaneous fabric peak rather than a measurement of it.
        peak_dropped_pps:
          type: integer
        dropped:
          type: integer
          description: 'Volume scrubbed over the whole attack, summed over vectors. Not always the same
            number as the prefix''s own dropped total: a rule guarding several prefixes has its volume
            attributed to each of them, and those vectors are marked shared. Read the prefix total when
            the two disagree.'
        flows:
          type: integer
        pulse:
          type: boolean
          description: The burst detector recognised a pulse train, which is why mitigation stayed engaged
            through the quiet stretches.
        vectors:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsVector'
    AnalyticsPoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
        flows:
          type: integer
        flows_dropped:
          type: integer
        offered:
          type: integer
        dropped:
          type: integer
        delivered:
          type: integer
        challenged:
          type: integer
        peak_pps:
          type: integer
          description: 'The heaviest fleet-wide rate inside the interval, not an average over it: an average
            is exactly what a burst attack is shaped to hide.'
        offered_pps:
          type: integer
        dropped_pps:
          type: integer
        pulsing:
          type: boolean
    AnalyticsSummary:
      type: object
      properties:
        prefix:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        flows:
          type: integer
        flows_dropped:
          type: integer
        offered:
          type: integer
        dropped:
          type: integer
        delivered:
          type: integer
          description: What reached the customer. A subtraction rather than its own counter, because the
            datapath only knows what it stopped.
        challenged:
          type: integer
        mitigated_pct:
          type: number
        peak_pps:
          type: integer
        peak_dropped_pps:
          type: integer
        offered_pps:
          type: integer
          description: Where the prefix stands right now, summed across the nodes currently reporting.
            A node that has gone quiet is left out.
        dropped_pps:
          type: integer
        nodes:
          type: integer
          description: Scrubbers currently carrying traffic for this prefix. Under anycast this is the
            fabric absorbing the attack, so one node during a flood is a problem.
        under_attack:
          type: boolean
        pulsing:
          type: boolean
        attacks:
          type: integer
        attack_seconds:
          type: number
    AnalyticsOverview:
      type: object
      properties:
        window:
          type: string
          example: 24h
        resolution:
          type: string
          description: How finely history is bucketed.
        retention:
          type: string
          description: 'How far back history is kept. It is in memory and not durable: it is derived from
            reports that keep arriving, so a restarted control plane rebuilds it within a couple of heartbeats
            rather than carrying stale numbers across the gap.'
        generated:
          type: string
          format: date-time
        tenant:
          type: object
          description: Present only for a tenant credential.
          properties:
            id:
              type: string
            name:
              type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSummary'
    AnalyticsSeries:
      type: object
      properties:
        prefix:
          type: string
        window:
          type: string
        step:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPoint'
    AnalyticsEvents:
      type: object
      properties:
        window:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEvent'
    DeployResult:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        nodes:
          type: integer
        datapath:
          type: string
        ml_ready:
          type: boolean
    Health:
      type: object
      properties:
        status:
          type: string
        product:
          type: string
        datapath:
          type: string
        mode:
          type: string
          enum:
          - primary
          - replica
    SampleBatch:
      type: object
      required:
      - samples
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
          minItems: 1
    TrainRequest:
      type: object
      properties:
        epochs:
          type: integer
          minimum: 1
          description: Default 200.
        lr:
          type: number
          description: Learning rate. Default 0.15.
        threshold:
          type: number
          description: Score at or above which a flow is an attack. Default 0.7.
        max_false_positive_rate:
          type: number
          minimum: 0
          maximum: 1
          description: The share of the clean samples it is measured on that either model may drop, at its
            threshold to be published and at a tightened one for max_cut. Default 0.01.
        force:
          type: boolean
          description: Publish the fit even when it drops more than that, or a known-good sample. Its
            max_cut still holds it to the limit.
    DecideRequest:
      type: object
      required:
      - node_id
      - flow
      properties:
        node_id:
          type: string
        flow:
          $ref: '#/components/schemas/Flow'

openapi: 3.0.3
info:
  title: Scrubline Cloud API
  version: 0.1.0
  description: Control plane for the distributed scrubbing fabric. Drop path is ASIC/TCAM ACLs, FPGA, and PF_RING ZC. Not XDP.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Liveness
  /v1/nodes:
    get:
      summary: List scrubbing nodes
  /v1/nodes/register:
    post:
      summary: Register a node and its hardware backends
  /v1/nodes/{id}/heartbeat:
    post:
      summary: Keep a node live; a node past its TTL is not assigned prefixes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/nodes/{id}/program:
    get:
      summary: Compiled ASIC, FPGA, and ZC program a node agent installs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/policies:
    get:
      summary: List policies
    post:
      summary: Create or replace a policy
  /v1/policies/{id}/deploy:
    post:
      summary: Compile policy onto the fabric and assign prefixes to live nodes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/fabric:
    get:
      summary: Assignments plus compiled ASIC, FPGA, and ZC programs
  /v1/decide:
    post:
      summary: Run a flow record through a node's three-stage pipeline
  /v1/ml/samples:
    get:
      summary: List the labeled flow samples held for training
    post:
      summary: Add labeled flow samples for the ZC classifier
  /v1/ml/train:
    post:
      summary: Train the logistic flow model used on the PF_RING ZC path
  /v1/ml/model:
    get:
      summary: Current model weights and threshold
  /v1/ml/score:
    post:
      summary: Score one flow without running the hardware stages
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []

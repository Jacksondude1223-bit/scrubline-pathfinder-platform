openapi: 3.0.3
info:
  title: Scrubline Cloud control plane
  version: 0.2.0
  description: 'Control plane for the distributed scrubbing fabric. The drop path is ASIC/TCAM ACLs, FPGA
    meters and a PF_RING ZC userspace inspect path; it is not XDP.


    ## Credentials


    Three bearer credentials, three blast radii. A scrubbing node sits at the edge in someone else''s
    datacentre, so it never holds one that can change the fabric.


    | Credential | Held by | Reaches |

    | --- | --- | --- |

    | `operatorToken` | operators, `scrubctl` | everything |

    | `enrollToken` | node agents | `POST /v1/nodes/register`, and nothing else |

    | `nodeToken` | one scrubber | its own heartbeat, program and counters, plus `GET /v1/ml/model` |

    | `tenantToken` | one protected customer | `GET /v1/analytics/*`, for their own prefixes only |


    A node credential is issued at registration, scoped to that node, 256 bits, stored only as a hash
    and rotated whenever the node enrols again. An unset credential never matches: an empty token is a
    misconfiguration, not a way to open the control plane.


    Anything a credential is not allowed to reach answers `403`, not `404`.


    ## Analytics


    A customer buys protection for a prefix, not for a node, so everything under `/v1/analytics` is keyed
    by prefix and summed across the fabric. History is bucketed by the minute, kept for a day, and held
    in memory: it is derived from reports that keep arriving, so a restarted control plane rebuilds it
    within a couple of heartbeats rather than carrying stale numbers across the gap.


    Nodes report cumulative counters and the control plane deltas them. That is deliberate: a counter
    that only counts up survives a report being missed, and one that goes backwards is read as a node
    that restarted rather than as negative traffic.


    ## Transport


    Both binaries serve TLS and refuse to serve a routable address without it. Clients verify against
    the system roots or a private CA; verification is never disabled.


    ## Replicas


    A replica answers every read and refuses every write with `409`. Two control planes accepting writes
    would compile conflicting announcement plans and flap the fabric''s BGP.


    ## Durability


    A write is durable before it is acknowledged. If the state cannot be written the change is rolled
    back and the call answers `503` — a caller is never told a policy was saved that the control plane
    will forget.'
  license:
    name: See repository
servers:
- url: https://127.0.0.1:8080
  description: A control plane serving TLS
- url: http://127.0.0.1:8080
  description: Loopback without TLS, which is the only address allowed to
tags:
- name: Operations
  description: Liveness and metrics.
- name: Nodes
  description: Enrolment, liveness and what each scrubber installs.
- name: Policy
  description: Protected prefixes, stage rules, steering, game filters, and compiling them across the
    fabric.
- name: Tunnels
  description: 'Customer return tunnels: the address each scrubbing node terminates them on, and
    adding, changing and switching them off node by node on the deployed policy.'
- name: Classifier
  description: The flow-level model the ZC stage scores with.
- name: Analytics
  description: 'What a protected customer sees: their own traffic, what was scrubbed out of it, and the
    attacks they have been under. Also the customer records and credentials behind that view.'
- name: Replication
  description: Following a primary, and taking over from one.
security: &id001
- operatorToken: []
paths:
  /health:
    get:
      summary: Liveness, and which mode this control plane is in
      tags:
      - Operations
      security: []
      description: 'Open: no credential. It carries no policy detail.'
      responses:
        '503':
          description: A request failed so badly that the control-plane state can no longer be used. Restart the process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The control plane is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      summary: Prometheus exposition for the control plane and the reporting fleet
      tags:
      - Operations
      security: *id001
      responses:
        '200':
          description: Exposition in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Only GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The exposition could not be rendered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: No bearer credential, or one the control plane does not know.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: The credential is valid but not allowed here. The body says which credential the
            endpoint needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Node series are built from the counters each node attached to its heartbeat. The exposition
        names every node, its load and its rule hits, so a node credential cannot read it.
  /v1/state:
    get:
      summary: The durable control-plane state a replica follows
      tags:
      - Replication
      security: *id001
      responses:
        '200':
          description: The current durable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401': *id002
        '403': *id003
      description: Carries every policy and every node credential hash, so it is reachable only with the
        operator credential. A replica polls this and writes what it gets through to its own state file.
  /v1/promote:
    post:
      summary: Turn a replica into the primary
      tags:
      - Replication
      security: *id001
      responses:
        '200':
          description: Promoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - primary
        '409':
          description: This control plane is already the primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: Deliberate, and one way. Promoting while the old primary still lives gives two control
        planes compiling conflicting announcement plans, so fence the old one first. Nothing reachable
        from a replica can tell a dead primary from an unreachable one, which is why this is not automatic.
  /v1/nodes/register:
    post:
      summary: Register a node, and issue the credential scoped to it
      tags:
      - Nodes
      security:
      - enrollToken: []
      - operatorToken: []
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '400':
          description: Missing name, or a field that will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A different live node already holds this name and region, or this control plane
            is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: A credential could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Registration is also credential issue. The token in the response is returned once
        and never served again; re-registering rotates it and the previous one stops working immediately.


        Node ids derive from name and region, so two scrubbers sharing both collapse onto one identity.
        A registration that would take over a node that is still live, from a different advertise address,
        is refused with 409; once the incumbent has aged out a replacement may take the identity.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
  /v1/nodes:
    get:
      summary: List the fleet
      tags:
      - Nodes
      security: *id001
      responses:
        '200':
          description: Every registered node.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '401': *id002
        '403': *id003
      description: 'Status is derived from the last heartbeat: a node past its TTL reads stale and is
        withdrawn from anycast.'
  /v1/nodes/{id}/heartbeat:
    post:
      summary: Keep a node live, and report its datapath counters
      tags:
      - Nodes
      security: &id004
      - nodeToken: []
      - operatorToken: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: The body was present but malformed, or reported the same tunnel twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The control plane does not know this node. Enrol again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id006
          description: This control plane is a replica and does not accept writes. Send them to the primary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'A node may heartbeat only for itself. The body is optional; an agent that sends none
        still heartbeats. Counters are keyed to the node the path names and labelled from the record the
        control plane already holds, so a report cannot claim to be another node.


        `tunnels` is what this node''s provisioner says about its return paths. It rides the heartbeat
        rather than having an endpoint of its own because it has to arrive as often as liveness does:
        a tunnel that went down between two polls is a prefix being black-holed until the next one. A
        tunnel reported down withdraws its prefixes from this node immediately, and the fabric recompiles
        on the change rather than waiting for the next scheduled pass.'
      parameters: &id005
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stats:
                  $ref: '#/components/schemas/Stats'
                tunnels:
                  type: array
                  items:
                    $ref: '#/components/schemas/TunnelStatus'
  /v1/nodes/{id}/program:
    get:
      summary: What a node installs
      tags:
      - Nodes
      security: *id004
      responses:
        '200':
          description: The compiled program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          description: No program has been deployed for this node yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: A program names the prefixes a node scrubs and what it announces, so a node may fetch
        only its own.
      parameters: *id005
  /v1/nodes/{id}/stats:
    get:
      summary: The counters a node last reported
      tags:
      - Nodes
      security: *id004
      responses:
        '200':
          description: The last report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: This node has reported no counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      parameters: *id005
  /v1/policies:
    get:
      summary: List policies
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: Every policy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '401': *id002
        '403': *id003
    post:
      summary: Create or replace a policy
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: A field will not validate. The message names the offending index and why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': &id007
          description: Durable state could not be written. The change was rolled back and did not take
            effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Saving does not deploy; POST the deploy endpoint for that. An id that already exists
        is replaced and its version bumped.


        Everything is validated here rather than on fifty scrubbers: CIDRs, ports, rule and filter ids,
        steering regions and communities, and the game filters are compiled. A policy carrying game filters
        is issued a challenge secret, shared across the fabric so a cookie minted by one node verifies
        on another.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
  /v1/policies/{id}/deploy:
    post:
      summary: Compile a policy across the fabric
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: Deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResult'
        '404':
          description: No such policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No live nodes to deploy onto, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Compiles the ASIC, FPGA and ZC programs and the BGP announcement plan, and stores
        them. Agents pick their program up on their next poll.


        The plan covers every registered node, not only the live ones: a node that stopped answering needs
        an explicit withdrawal, and one that comes back finds its program already compiled.'
      parameters: *id005
  /v1/fabric:
    get:
      summary: The BGP announcement plan and the compiled programs
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: The current fabric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fabric'
        '401': *id002
        '403': *id003
  /v1/ml/samples:
    get:
      summary: The labelled training set
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: Every stored sample.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
        '401': *id002
        '403': *id003
    post:
      summary: Add labelled flow records
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored:
                    type: integer
        '400':
          description: A sample will not validate. The message names the index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The batch would push the training set past its limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  stored:
                    type: integer
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'The whole batch is refused on the first bad record: one out-of-range field would otherwise
        train a model whose weights are all NaN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleBatch'
  /v1/ml/train:
    post:
      summary: Fit the ZC classifier
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: The fitted model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModel'
        '400':
          description: Fewer than two samples, a malformed body, or a fit that diverged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'An absent body takes the defaults; a malformed one is an error rather than something
        to ignore.


        One sample in five is held out of the fit and the reported metrics are measured on that holdout.
        Sets below ten samples are too small to split and report training metrics with validation 0.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainRequest'
  /v1/ml/model:
    get:
      summary: The published model weights
      tags:
      - Classifier
      security:
      - nodeToken: []
      - operatorToken: []
      responses:
        '200':
          description: The current model. ready is false when none has been fitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModel'
        '401': *id002
        '403': *id003
      description: Every node installs this, so a node credential may read it. It carries weights, not
        policy or fleet detail.
    delete:
      summary: Retire the published model
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModel'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: Agents clear their installed copy on the next poll. Without this a bad model could
        only be removed by restarting every agent in the fleet.
  /v1/ml/score:
    post:
      summary: Score one flow without running the hardware stages
      tags:
      - Classifier
      security: *id001
      responses:
        '200':
          description: The score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
                  label:
                    type: integer
                    enum:
                    - 0
                    - 1
                  ready:
                    type: boolean
        '400':
          description: The flow will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Flow'
  /v1/decide:
    post:
      summary: Run a flow record through a node's pipeline
      tags:
      - Policy
      security: *id001
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: The flow will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No program is deployed for that node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Evaluates against the program deployed to that node, in the real pipeline. Useful
        for asking what a policy would do before trusting it.


        The flow may carry a base64 payload. Without one the game filter reports the packet uninspectable
        and never drops it, because it refuses to judge what it was not given. Rate state accumulates
        across calls, so repeated calls can trip a behavioural cap.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
  /v1/analytics/overview:
    get:
      summary: How each protected prefix is doing
      tags:
      - Analytics
      security: &id008
      - tenantToken: []
      - operatorToken: []
      responses:
        '200':
          description: The current view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: The window will not parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'The customer-facing view: one row per protected prefix, summed across the whole fabric
        rather than reported per node. A customer does not have a node, they have a prefix, and under
        anycast it is carried by every scrubber at once.


        A tenant credential sees only the prefixes it is entitled to, and an entitlement nothing has reported
        for yet comes back reading zero rather than being left out — an empty page is indistinguishable
        from an outage.'
      parameters:
      - &id009
        name: window
        in: query
        required: false
        schema:
          type: string
          default: 24h
        description: How far back to report, as a duration (15m, 6h, 24h). Clamped to the retention horizon.
          A value that will not parse is refused rather than silently answering a different question.
  /v1/analytics/series:
    get:
      summary: One prefix's traffic over time
      tags:
      - Analytics
      security: *id008
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          description: No prefix, or a window or step that will not parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Each point reports the heaviest moment inside it rather than an average over it, because
        an average is what a burst attack is shaped to hide.


        A prefix the credential is not entitled to answers 403 whether or not it exists: a customer must
        not be able to map the platform''s other customers by watching which prefixes answer differently.'
      parameters:
      - name: prefix
        in: query
        required: true
        schema:
          type: string
        example: 203.0.113.0/24
        description: Must be one the credential is entitled to.
      - *id009
      - name: step
        in: query
        required: false
        schema:
          type: string
        description: Interval per point. Rounded up to the resolution, and defaulted to about 120 points
          across the window. Points are aligned to the step, so two reads of the same dashboard line up.
  /v1/analytics/events:
    get:
      summary: The attacks a prefix has been under
      tags:
      - Analytics
      security: *id008
      responses:
        '200':
          description: The attack log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEvents'
        '400':
          description: The window will not parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id003
      description: 'Newest first. Each attack names the rules and filters that stopped it, because "you
        were attacked" on its own is not something a customer can act on.


        An attack is opened when a meaningful share of a prefix''s traffic is being scrubbed, or when
        the burst detector recognises a pulse train. It is not closed on the first quiet moment: a burst
        train is quiet between bursts by design, and closing early would record one attack as fifty.'
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          type: string
        description: One prefix. Omit for every prefix the credential can see.
      - *id009
  /v1/tenants:
    get:
      summary: List customers
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: Every customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '401': *id002
        '403': *id003
      description: 'Entitlements, not credentials: a credential''s plaintext is returned once at issue
        and never kept.'
    post:
      summary: Create or replace a customer
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Missing name, no prefixes, or a prefix that will not parse or is not masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Saving does not issue a credential; POST the token endpoint for that. An id that already
        exists is replaced, which is how entitlements are changed.


        Prefixes must be written masked. The entitlement is matched against what was written, so one with
        host bits set would authorize differently than it reads.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant'
  /v1/tenants/{id}/token:
    post:
      summary: Issue or rotate a customer's credential
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: The credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCredential'
        '404':
          description: Unknown customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: Returned once and never served again. Only the hash is kept, so a lost credential is
        rotated rather than recovered, and issuing again invalidates the previous one immediately.
      parameters: *id005
  /v1/tenants/{id}:
    delete:
      summary: Offboard a customer
      tags:
      - Analytics
      security: *id001
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '404':
          description: Unknown customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: Takes the credential with it. One that outlived its tenant would authenticate to an
        empty entitlement rather than to nothing.
      parameters: *id005
  /v1/nodes/{id}/tunnel-endpoint:
    put:
      summary: Assign the address a node's tunnels terminate on
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Assigned, and the fabric recompiled with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointNode'
        '400':
          description: The address is not IPv4, or is not one a customer edge could reach (unspecified,
            loopback, multicast or broadcast).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another node already terminates tunnels on that address, or this control plane
            is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Makes this node''s own address the local end of every customer tunnel it builds,
        so each customer''s GRE tunnel runs straight to the scrubbing node that carries its prefixes. The
        same address is what the node peers customer BGP sessions from.


        The assignment is the operator''s: it overrides the tunnel_src the node registered with, and survives
        the node re-registering, so a node cannot move its own tunnels. Two nodes may not share an address,
        since each would take the other''s customer replies. Prefixes withdrawn because the node had no
        endpoint are announced again on the recompile this triggers.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TunnelEndpoint'
    delete:
      summary: Return a node to the tunnel endpoint it registered with
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Cleared, and the fabric recompiled without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointNode'
        '404':
          description: No such node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id006
        '503': *id007
        '401': *id002
        '403': *id003
      description: The node falls back to its own registered tunnel_src. A node that registered without
        one has no endpoint afterwards, and withdraws every prefix that has a return path.
      parameters: *id005
  /v1/tunnels:
    get:
      summary: Every return tunnel of the deployed policy, node by node
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: The deployed policy's tunnels. A control plane with nothing deployed answers with
            a null policy_id and no tunnels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelFleet'
        '401': *id002
        '403': *id003
      description: For each tunnel, every node that carries any of its prefixes, with the address the
        tunnel terminates on there, whether it is enabled on that node, what the node's provisioner last
        reported, and which of its prefixes the fabric is announcing or withdrawing from that node and
        why. A row with a problem is a node that is not delivering those prefixes.
  /v1/tunnels/{id}:
    put:
      summary: Create or replace a tunnel in the deployed policy
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: The tunnel will not validate against the policy, or the id in the body differs
            from the one in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'Tunnels belong to the deployed policy, so a change here bumps its version, is validated
        with the whole policy, and is compiled onto the fabric straight away: no separate deploy. The body
        replaces the tunnel whole, including its disabled list; the id comes from the path.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tunnel'
    delete:
      summary: Remove a tunnel from the deployed policy
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Removed as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelDeleted'
        '404':
          description: The deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: Its prefixes no longer have a return path, so the nodes carrying them announce them
        without one, as they would a prefix that never had a tunnel.
      parameters: *id005
  /v1/tunnels/{id}/disable:
    post:
      summary: Take a tunnel down on some nodes
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: The body names no nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such node, or the deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: 'The named nodes stop building the tunnel and withdraw its prefixes, since they would
        have no way to deliver what they attracted; the rest of the fabric keeps carrying them. For maintenance
        on one site''s path, or taking a misbehaving one out without touching the others.'
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeSelection'
  /v1/tunnels/{id}/enable:
    post:
      summary: Bring a tunnel back on some nodes
      tags:
      - Tunnels
      security: *id001
      responses:
        '200':
          description: Saved as a new version of the deployed policy, and deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelChange'
        '400':
          description: The body names no nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such node, or the deployed policy has no such tunnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No policy is deployed, or this control plane is a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id007
        '401': *id002
        '403': *id003
      description: Undoes disable for the named nodes. Naming a node the tunnel was never disabled on
        is not an error.
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeSelection'
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: Full control-plane access. SCRUBLINE_API_TOKEN.
    enrollToken:
      type: http
      scheme: bearer
      description: Registers a node and collects its credential. Nothing else. SCRUBLINE_ENROLL_TOKEN.
    nodeToken:
      type: http
      scheme: bearer
      description: Issued at registration, scoped to one node.
    tenantToken:
      type: http
      scheme: bearer
      description: 'Issued to a customer, scoped to the prefixes they are entitled to. Read-only, and
        the narrowest credential the platform issues: it cannot see the fleet, the policy behind the protection,
        or another customer''s traffic.'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: What went wrong, in a sentence an operator can act on.
    Match:
      type: object
      description: Which packets a rule applies to. Every field is optional; an empty match applies to
        everything the stage sees.
      properties:
        src_cidr:
          type: string
          example: 198.51.100.0/24
        dst_cidr:
          type: string
          example: 203.0.113.0/24
        proto:
          type: string
          enum:
          - tcp
          - udp
          - icmp
          - any
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        sport:
          type: integer
          minimum: 0
          maximum: 65535
        tcp_flags:
          type: string
          example: syn
    Rule:
      type: object
      required:
      - id
      - stage
      - action
      properties:
        id:
          type: string
          description: 'Unique within the policy. Must not contain ''|'': rule ids key the per-source
            rate table.'
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
          description: asic is TCAM ACLs, fpga is line-rate meters, zc is the userspace inspect path.
            Only zc sees payload.
        action:
          type: string
          enum:
          - drop
          - permit
          - rate_limit
          - inspect
          - count
          description: drop and permit are terminal. count is observe-only and never drops. rate_limit
            meters. inspect hands the flow to the ZC path.
        match:
          $ref: '#/components/schemas/Match'
        pps:
          type: integer
          minimum: 0
          description: Only an fpga rate_limit, and a zc rate_limit or inspect, consume this. Set anywhere
            else the policy is refused rather than the value silently ignored.
        priority:
          type: integer
          description: First match decides, on every stage. Equal priorities keep policy order.
        comment:
          type: string
    Steering:
      type: object
      required:
      - prefix
      properties:
        prefix:
          type: string
          description: Must be one of the policy's protected prefixes.
        regions:
          type: array
          items:
            type: string
          description: A hard boundary. A node outside these neither announces the prefix nor inspects
            traffic for it.
        communities:
          type: array
          items:
            type: string
          description: 'BGP communities to attach. Validated here because agents write them into a routing
            daemon: only ASN:value, ASN:value:value, or a well-known name.'
    GameMagic:
      type: object
      required:
      - offset
      - hex
      properties:
        offset:
          type: integer
          minimum: 0
        hex:
          type: string
          example: deadbeef
          description: Bytes that must appear at offset.
    GameSignature:
      type: object
      description: A protocol described in the policy, for a game the platform ships no profile for.
      properties:
        min_len:
          type: integer
          minimum: 0
        max_len:
          type: integer
          minimum: 0
        packet_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Allowed first byte. Empty allows any.
        magic:
          type: array
          items:
            $ref: '#/components/schemas/GameMagic'
        gate:
          type: string
          enum:
          - none
          - handshake
          description: 'A challenge gate cannot be described here: answering one means emitting protocol-correct
            bytes, and a wrong guess breaks every client rather than failing closed.'
        opener_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Packet ids an unadmitted source may send.
        complete_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: Packet ids that finish the handshake and admit the source. Required with a handshake
            gate.
    GameFilter:
      type: object
      required:
      - id
      description: Admits traffic to a game port only if it looks like that game. Bound to a port on a
        protected address, not to a game the platform knows about.
      properties:
        id:
          type: string
          description: Unique within the policy. Must not contain '|'.
        dst_cidr:
          type: string
        proto:
          type: string
          enum:
          - tcp
          - udp
          - any
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        profile:
          type: string
          enum:
          - raknet
          - a2s
          description: A built-in protocol. Omit when custom describes one inline; setting both is refused.
        custom:
          $ref: '#/components/schemas/GameSignature'
        observe:
          type: boolean
          description: Record what the filter would have done without acting on it.
        comment:
          type: string
    Policy:
      type: object
      required:
      - name
      - protected
      properties:
        id:
          type: string
          description: Assigned on save when omitted.
        name:
          type: string
        protected:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: Network prefixes with no host bits set, each naming a different network. A speaker
            refuses a route with host bits, so such a prefix would never be announced.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        steering:
          type: array
          items:
            $ref: '#/components/schemas/Steering'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameFilter'
        reputation:
          $ref: '#/components/schemas/ReputationPolicy'
        egress:
          $ref: '#/components/schemas/EgressPolicy'
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/Tunnel'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        pulse_floor_pps:
          type: integer
          minimum: 0
          description: 'How loud a burst must be to count toward a burst train. Shape alone cannot decide
            it: a sparse trickle has the same crest factor and duty cycle as an attack. Zero takes the
            platform default.'
        challenge_secret:
          type: string
          description: Generated on save when the policy carries game filters, and shipped to every node
            so a cookie minted by one scrubber verifies on another.
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Bumped on every save of the same id.
    Node:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
        capacity_gbps:
          type: number
          minimum: 0
          description: Weights AS-path prepends against the rest of the fabric.
        capacity_pps:
          type: integer
          minimum: 0
          description: Packet-rate ceiling load-driven shedding measures against. A node that declares
            none is never padded for load.
        backends:
          type: array
          items:
            type: string
            enum:
            - asic
            - fpga
            - zc
          description: Stages this node can install. Empty means full-stack.
        advertise:
          type: string
          description: Address peers reach this node on; its host becomes the BGP next hop.
        tunnel_src:
          type: string
          example: 192.0.2.1
          description: 'Local address this node builds customer return tunnels from, and peers customer
            sessions from. Per node rather than per tunnel because the fabric is anycast: every node carrying
            a prefix needs its own tunnel to the one customer endpoint, and they cannot share a source.
            A node without one is withdrawn from any prefix that has a return path, rather than attracting
            traffic it could not deliver. An operator''s assignment through PUT /v1/nodes/{id}/tunnel-endpoint
            takes the place of the registered value and survives re-registration.'
        last_seen:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ready
          - stale
    RegistrationResult:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/Node'
        token:
          type: string
          description: The credential issued to this node, scoped to it. Returned once, here, and never
            served again. Re-registering rotates it and the previous one stops working immediately.
    Announcement:
      type: object
      properties:
        prefix:
          type: string
        node_id:
          type: string
        node_name:
          type: string
        region:
          type: string
        state:
          type: string
          enum:
          - announce
          - withdraw
        prepends:
          type: integer
          description: AS-path padding. Higher means the node is a less attractive path and takes less
            of the prefix's traffic.
        communities:
          type: array
          items:
            type: string
        next_hop:
          type: string
        reason:
          type: string
    ACLEntry:
      type: object
      properties:
        priority:
          type: integer
        action:
          type: string
        match:
          $ref: '#/components/schemas/Match'
        rule_id:
          type: string
        tcam_key:
          type: string
    FPGAEntry:
      type: object
      properties:
        table:
          type: string
        priority:
          type: integer
        match:
          $ref: '#/components/schemas/Match'
        meter_pps:
          type: integer
        action:
          type: string
        rule_id:
          type: string
    ZCEntry:
      type: object
      properties:
        cluster:
          type: string
        priority:
          type: integer
        match:
          $ref: '#/components/schemas/Match'
        action:
          type: string
        pps:
          type: integer
        rule_id:
          type: string
    Program:
      type: object
      description: What one node installs. Compiled from the policy and the live node set.
      properties:
        node_id:
          type: string
        policy_id:
          type: string
        version:
          type: integer
        prefixes:
          type: array
          items:
            type: string
          description: 'Prefixes this node enforces policy on, including ones it is currently withdrawing:
            BGP takes time to converge and traffic still arriving should be scrubbed.'
        asic:
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
        fpga:
          type: array
          items:
            $ref: '#/components/schemas/FPGAEntry'
        zc:
          type: array
          items:
            $ref: '#/components/schemas/ZCEntry'
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameFilter'
        challenge_secret:
          type: string
        pulse_floor_pps:
          type: integer
        reputation:
          $ref: '#/components/schemas/ReputationPolicy'
        egress:
          $ref: '#/components/schemas/EgressPolicy'
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/NodeTunnel'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        compiled_at:
          type: string
          format: date-time
          description: Changes on every recompile, including one that reassigns prefixes without bumping
            the policy version. Agents key their reload on it.
        tunnel_src:
          type: string
          description: The tunnel endpoint the control plane holds for this node, which an operator may
            have assigned since it registered. The agent peers customer sessions from it.
    Flow:
      type: object
      description: One flow record.
      properties:
        src_ip:
          type: string
        dst_ip:
          type: string
        proto:
          type: string
          enum:
          - tcp
          - udp
          - icmp
        sport:
          type: integer
          minimum: 0
          maximum: 65535
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        flags:
          type: string
          example: syn
        pps:
          type: integer
          minimum: 0
          description: The flow's observed packet rate.
        payload:
          type: string
          format: byte
          description: 'Packet bytes, base64. Only the ZC stage sees it. Without one the game filter reports
            the packet uninspectable and never drops it: it refuses to judge what it was not given.'
    Decision:
      type: object
      properties:
        action:
          type: string
          enum:
          - drop
          - permit
          - rate_limit
          - inspect
          - count
          - challenge
          description: challenge means this packet is dropped and reply is emitted to the source.
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
        rule_id:
          type: string
        reason:
          type: string
        node_id:
          type: string
        score:
          type: number
          description: Classifier score, when the ZC model decided.
        filter:
          type: string
          description: The game filter that decided, when one did.
        reply:
          type: string
          format: byte
          description: Bytes the datapath sends back to the source. Set only on a challenge.
    MLModel:
      type: object
      properties:
        weights:
          type: array
          items:
            type: number
        bias:
          type: number
        threshold:
          type: number
        epochs:
          type: integer
        loss:
          type: number
        accuracy:
          type: number
          description: Measured on the holdout, not on the samples the model was fitted on.
        precision:
          type: number
          description: 'On the holdout. Watch this one: a false positive here is dropped customer traffic.'
        recall:
          type: number
          description: On the holdout.
        validation:
          type: integer
          description: Samples held out of the fit. Zero means the set was too small to split.
        samples:
          type: integer
        ready:
          type: boolean
        withdrawn:
          type: boolean
          description: Set by DELETE /v1/ml/model. Agents clear their copy when they see it; the zero
            model cannot signal this because it is indistinguishable from never trained.
    Sample:
      type: object
      required:
      - flow
      - label
      properties:
        flow:
          $ref: '#/components/schemas/Flow'
        label:
          type: integer
          enum:
          - 0
          - 1
          description: 0 clean, 1 attack.
    StageStats:
      type: object
      properties:
        stage:
          type: string
        dropped:
          type: integer
        permitted:
          type: integer
        pps_dropped:
          type: integer
        pps_permitted:
          type: integer
    RuleStats:
      type: object
      properties:
        rule_id:
          type: string
        stage:
          type: string
        matches:
          type: integer
        drops:
          type: integer
        pps_seen:
          type: integer
        pps_dropped:
          type: integer
    GameStats:
      type: object
      properties:
        filter_id:
          type: string
        profile:
          type: string
        inspected:
          type: integer
        dropped:
          type: integer
        challenged:
          type: integer
        uninspectable:
          type: integer
          description: Packets the filter was given no payload for. It never drops on these, so a rising
            value means the datapath is not supplying payloads and the filter is doing nothing.
        pps_dropped:
          type: integer
    PrefixStats:
      type: object
      description: 'Everything one node knows about the traffic aimed at one protected prefix. Reported
        per prefix rather than per node because that is the unit a customer buys: a scrubber carries many
        prefixes, so its own totals say nothing about whether any particular one was attacked.'
      properties:
        prefix:
          type: string
        flows:
          type: integer
          description: Decisions for this prefix. Cumulative since the node started carrying it; the control
            plane deltas these, and a counter that only counts up survives a report being missed.
        flows_dropped:
          type: integer
          description: Of those, dropped or challenged. Cumulative.
        offered:
          type: integer
          description: Sum of the per-flow rates reported on flows arriving for this prefix. A volume
            weighting of the flow count, not a packet counter. Cumulative.
        dropped:
          type: integer
          description: The same weighting over the flows that were scrubbed. Cumulative.
        offered_pps:
          type: integer
          description: Moving average over the node's load window, not a total.
        dropped_pps:
          type: integer
          description: Moving average over the node's load window, not a total.
        pulsing:
          type: boolean
          description: True while a burst train is recognised, including through the quiet stretches between
            bursts.
        peak_pps:
          type: integer
        mean_pps:
          type: integer
        crest:
          type: number
          description: Peak over mean. Steady traffic sits near one however heavy it is.
        duty_cycle:
          type: number
        bursts:
          type: integer
        held_for_seconds:
          type: number
    MLStats:
      type: object
      properties:
        ready:
          type: boolean
        scored:
          type: integer
        drops:
          type: integer
        passes:
          type: integer
    Stats:
      type: object
      description: A node's datapath counters. Most are monotonic totals; the fields documented as rates
        are moving averages.
      properties:
        decisions:
          type: integer
        unowned:
          type: integer
          description: Flows for a prefix this node does not carry. A rising value means the steering
            layer and the fabric disagree about who scrubs what.
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageStats'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleStats'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameStats'
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/PrefixStats'
        ml:
          $ref: '#/components/schemas/MLStats'
        pulsing:
          type: boolean
        pulse_peak_pps:
          type: integer
        game_sessions:
          type: integer
        game_sessions_max:
          type: integer
        reputation:
          $ref: '#/components/schemas/ReputationStats'
        egress:
          $ref: '#/components/schemas/EgressStats'
        rate_buckets:
          type: integer
        rate_buckets_max:
          type: integer
        offered_pps:
          type: integer
          description: Moving average over load_window_seconds, not a total.
        dropped_pps:
          type: integer
          description: Moving average over load_window_seconds, not a total.
        load_window_seconds:
          type: integer
    Report:
      type: object
      properties:
        node_id:
          type: string
        name:
          type: string
        region:
          type: string
        stats:
          $ref: '#/components/schemas/Stats'
        reported_at:
          type: string
          format: date-time
    Fabric:
      type: object
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        ml:
          $ref: '#/components/schemas/MLModel'
    Snapshot:
      type: object
      description: 'The durable control-plane state a replica follows. Liveness, derived state and reported
        counters are deliberately absent: they are either worthless across a restart or recompiled from
        the policy.'
      properties:
        version:
          type: integer
        saved_at:
          type: string
          format: date-time
        seq:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        node_tokens:
          type: object
          additionalProperties:
            type: string
          description: Node id to credential hash. Hashes only; a dump of this hands nobody a working
            credential.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        last_policy_id:
          type: string
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
        model:
          $ref: '#/components/schemas/MLModel'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        tenant_tokens:
          type: object
          additionalProperties:
            type: string
          description: Tenant id to credential hash. Hashes only, for the same reason node_tokens are.
    ReputationPolicy:
      type: object
      description: 'Tunes the two-tier source cache: who gets the short path, and whether repeat offenders
        are dropped at the top of the pipeline.'
      properties:
        fast_pass:
          type: string
          enum:
          - challenge
          - egress
          - handshake
          - 'off'
          description: 'The weakest proof that earns the short path. Defaults to challenge, the stricter
            reading: answering one means echoing a value that could only have come from a reply to that
            address, so the address answers for itself, while a handshake can be sent blind and a spoofer
            can clear it for any address. Widening to handshake is reasonable for a protocol that defines
            no challenge, and is a deliberate decision rather than a default.'
        penalty_box:
          type: boolean
          description: 'Drop sources that keep failing, at the top of the pipeline, rather than letting
            them walk every stage to the same verdict. Off by default: it is an escalation of consequence
            beyond what one packet earned. With it off, strikes and would-be demotions are still counted
            and exposed, which is how it is sized before being switched on.'
    EgressPolicy:
      type: object
      description: What the fabric does with the return path it can see. Watching what the origin sends
        back is the one confirmation that needs no protocol knowledge — whatever the service speaks, if
        it is answering an address at length it considers that address a client — and the only signal
        here an attacker cannot forge from the ingress side.
      properties:
        lockdown:
          type: string
          enum:
          - 'off'
          - limit
          - drop
          description: 'What happens to an unconfirmed source while a prefix is under a recognised attack.
            Off by default: under lockdown a client that has proved nothing is held back, and a brand-new
            legitimate client has by definition proved nothing yet, so this trades joinability during
            an attack for a protocol-agnostic filter. limit holds it to a trickle; drop silences it. Never
            applies to a prefix whose return path is not visible.'
        lockdown_pps:
          type: integer
          minimum: 0
          description: The cap an unconfirmed source is held to in limit mode. Zero takes the platform
            default.
        grace_millis:
          type: integer
          minimum: 0
          description: 'How long a source this node has not seen before is left alone under lockdown.
            Zero takes the platform default of 500ms. Without it lockdown cannot be escaped: a new client
            is unconfirmed, so it is held back, so its packets never reach the origin, so the origin never
            answers, so it is never confirmed.'
    EgressPrefixState:
      type: object
      properties:
        prefix:
          type: string
        visibility:
          type: string
          enum:
          - visible
          - asymmetric
          - unknown
          description: asymmetric means this prefix carries ingress but no replies come back through this
            node — direct server return, or the node is off the return path. Everything depending on return
            traffic stands down for it, because reading an absence of replies as 'nobody is confirmed'
            would hold back every real client.
        clients:
          type: integer
        confirmed:
          type: integer
    EgressStats:
      type: object
      description: The return-path picture one node holds.
      properties:
        prefixes:
          type: integer
        clients:
          type: integer
        clients_max:
          type: integer
        confirmed:
          type: integer
        promotions:
          type: integer
        full:
          type: integer
        asymmetric:
          type: integer
          description: Prefixes whose return path is not visible here.
        seen:
          type: integer
          description: Replies observed travelling back through this node.
        promoted:
          type: integer
        locked_down:
          type: integer
          description: Ingress held back for want of a confirmation.
        lockdown:
          type: string
          enum:
          - 'off'
          - limit
          - drop
        prefix_states:
          type: array
          items:
            $ref: '#/components/schemas/EgressPrefixState'
    ReputationStats:
      type: object
      description: The two-tier source cache's counters.
      properties:
        tracked:
          type: integer
        max:
          type: integer
          description: At the bound a source takes the ordinary path, so this costs an optimisation rather
            than a protection.
        trusted:
          type: integer
        penalised:
          type: integer
        fast_passed:
          type: integer
          description: Packets taken off the slow path because their source was already verified.
        boxed:
          type: integer
          description: 'Packets dropped at the top because their source is in the box: the load the rest
            of the stages did not carry.'
        promotions:
          type: integer
        demotions:
          type: integer
        strikes:
          type: integer
        shielded:
          type: integer
          description: Strikes that landed on an already-verified source and were not acted on. Source
            addresses are attacker-controlled, so acting on one would let anyone get a real player banned.
            A rising value is a spoofing attempt or a misbehaving verified client, and both want a human.
        full:
          type: integer
    Tunnel:
      type: object
      required:
      - id
      - remote
      - prefixes
      description: 'The return path for a set of protected prefixes: where scrubbed traffic goes once
        it is clean. This is the half of a scrubbing service BGP cannot do — announcing a prefix pulls
        the traffic in, and it then cannot be routed back the ordinary way, because as far as the internet
        is concerned the scrubbers are that prefix now. One Tunnel describes one customer endpoint; the
        fabric is anycast, so it compiles to one tunnel per node carrying the prefixes, all to the same
        remote.'
      properties:
        id:
          type: string
          example: northwind
          description: 'Becomes an interface name, so it is lowercase letters, digits and dashes, and
            at most 11 characters: the kernel truncates a name over its limit rather than refusing it,
            and two tunnels truncating to one name is one tunnel.'
        prefixes:
          type: array
          items:
            type: string
          minItems: 1
          description: Which protected prefixes ride this tunnel. Each must be one the policy protects,
            and a prefix belongs to at most one tunnel — backup paths are not modelled, so two would leave
            no answer to which return path is authoritative.
        type:
          type: string
          enum:
          - gre
          - ipip
          description: GRE unless the customer's edge cannot do it. ipip is lighter but carries no key,
            so it cannot demultiplex several tunnels between the same pair of addresses, and it carries IPv4
            only, so a tunnel with an IPv6 prefix must be GRE.
        remote:
          type: string
          example: 198.51.100.1
          description: 'The customer''s tunnel endpoint. The local end is each node''s own tunnel_src.
            IPv4 only: the MTU arithmetic here is IPv4''s, and a v6 endpoint would compile a tunnel wrong
            by twenty bytes.'
        mtu:
          type: integer
          description: 'Zero derives it from a 1500-byte path less this encapsulation''s overhead: 1476
            for GRE, 1472 with a key, 1480 for ipip. A value that does not fit is refused with the one
            that does.'
        mss_clamp:
          type: integer
          description: TCP MSS to clamp inbound traffic to. Zero derives it from the MTU, 40 bytes below
            it, or 60 when the tunnel carries an IPv6 prefix, since the clamp rewrites both families. Without clamping,
            a customer whose path drops the ICMP that path-MTU discovery needs sees TCP complete its handshake
            and then hang — the classic way a working tunnel still looks broken.
        key:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Demultiplexes several GRE tunnels between the same two addresses. Not available
            on ipip, and costs four bytes of MTU.
        required:
          type: boolean
          description: 'Makes a confirmed-up tunnel a precondition for announcing these prefixes from
            a node. Off by default: a fabric whose provisioner reports nothing would otherwise announce
            nothing at all and give no hint why. On, for operators whose tunnels report reliably and who
            would rather drop traffic than black-hole it.'
        direction:
          type: string
          enum:
          - both
          - return
          default: both
          description: 'both: clean traffic goes down the tunnel to the customer and the customer''s
            replies come back up it to the node, which forwards them to the internet. Replies are accepted
            only from the tunnel''s own prefixes, so the tunnel cannot relay anything else the customer
            edge sends into it. return: the tunnel carries clean traffic out only, and replies leave the
            customer by its own transit.'
        disabled:
          type: array
          items:
            type: string
          description: Node ids that must not build this tunnel. They withdraw its prefixes instead of
            attracting traffic they have no path to deliver. Set through the disable and enable endpoints.
        comment:
          type: string
    Session:
      type: object
      required:
      - id
      - peer_ip
      - peer_as
      - prefixes
      description: 'A BGP peering with a customer, for customers who announce their own prefixes rather
        than having them typed into a policy. What the session may carry is still declared here: a route
        learned from a customer does not add itself to the protected set, or a peer that leaked a supernet
        would have the fabric announcing address space it was never asked to protect.'
      properties:
        id:
          type: string
          description: Lowercase letters, digits, dashes and underscores. Becomes the peering's name in
            the rendered configuration, with dashes folded to underscores, so two ids that differ only
            in that are refused.
        peer_ip:
          type: string
          description: IPv4. The session peers from the node's IPv4 tunnel_src.
          example: 198.51.100.1
        peer_as:
          type: integer
          minimum: 1
          maximum: 4294967295
        local_as:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The AS the fabric peers from. Zero takes the node's own; a session with neither
            is refused rather than coming up announcing from whatever the daemon happened to hold.
        prefixes:
          type: array
          items:
            type: string
          minItems: 1
          description: What the session accepts, each one an IPv4 prefix the policy protects, since the
            rendered configuration carries an ipv4 channel only. The rendered filter admits
            these and anything more specific inside them, because customers de-aggregate under attack
            and a filter that refused that would drop the announcement when it mattered most.
        max_prefixes:
          type: integer
          minimum: 0
          description: Tears the session down past this many accepted routes. Zero derives a limit with
            headroom over the filter — a backstop against a leak, not an inventory.
        password:
          type: string
          description: 'TCP-MD5 secret, shipped only to the nodes terminating this session. Printable
            ASCII without spaces, quotes or backslashes: it is written into a routing daemon''s configuration,
            so a value that could close its string is refused rather than quoted.'
        multihop:
          type: integer
          minimum: 0
          maximum: 255
          description: TTL for a peer that is not directly attached.
        passive:
          type: boolean
          description: Wait for the customer to connect rather than dialling them.
        nodes:
          type: array
          items:
            type: string
          description: Node ids or names that terminate this session.
        regions:
          type: array
          items:
            type: string
          description: 'Regions that terminate it. Empty nodes and regions means every node, which is
            rarely wanted: a customer peers where they have a path, not with the whole fabric.'
        comment:
          type: string
    NodeTunnel:
      type: object
      description: One node's instance of a policy Tunnel, with the local end filled in and the derived
        values resolved, so the agent renders configuration rather than recomputing policy.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - gre
          - ipip
        local:
          type: string
          description: This node's tunnel_src.
        remote:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: The tunnel's prefixes that this node actually carries.
        mtu:
          type: integer
        mss_clamp:
          type: integer
        key:
          type: integer
        required:
          type: boolean
        interface:
          type: string
          example: scr-northwind
          description: The link name this compiles to, inside the kernel's 15-character limit.
        comment:
          type: string
        direction:
          type: string
          enum:
          - both
          - return
          description: Empty means both.
    TunnelEndpoint:
      type: object
      required:
      - address
      properties:
        address:
          type: string
          example: 192.0.2.1
          description: 'The node''s own IPv4 address, reachable from customer edges: the local end of
            its GRE tunnels.'
    EndpointNode:
      description: A node as the fabric uses it, with the tunnel endpoint in force.
      allOf:
      - $ref: '#/components/schemas/Node'
      - type: object
        properties:
          tunnel_endpoint_assigned:
            type: boolean
            description: Whether tunnel_src is an operator's assignment rather than what the node registered
              with.
    NodeSelection:
      type: object
      required:
      - nodes
      properties:
        nodes:
          type: array
          minItems: 1
          items:
            type: string
          description: Node ids.
    TunnelChange:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
          description: The deployed policy's version after the change.
        tunnel:
          $ref: '#/components/schemas/Tunnel'
    TunnelDeleted:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
        deleted:
          type: string
          description: The tunnel id removed.
    TunnelFleet:
      type: object
      properties:
        policy_id:
          type: string
          nullable: true
        version:
          type: integer
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/TunnelOverview'
    TunnelOverview:
      type: object
      description: A policy Tunnel with its defaults resolved, and how it stands on each node.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - gre
          - ipip
        direction:
          type: string
          enum:
          - both
          - return
        remote:
          type: string
        key:
          type: integer
        prefixes:
          type: array
          items:
            type: string
        required:
          type: boolean
        disabled:
          type: array
          items:
            type: string
        comment:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TunnelNode'
    TunnelNode:
      type: object
      description: One node carrying some of a tunnel's prefixes.
      properties:
        node_id:
          type: string
        name:
          type: string
        region:
          type: string
        status:
          type: string
          enum:
          - ready
          - stale
        endpoint:
          type: string
          description: The local end of this node's tunnel. Empty when it has none.
        endpoint_assigned:
          type: boolean
          description: Whether the endpoint is an operator's assignment.
        enabled:
          type: boolean
        state:
          type: string
          enum:
          - up
          - down
          - unknown
          - unreported
          description: What the node's provisioner last reported.
        reported_at:
          type: string
          format: date-time
        prefixes:
          type: array
          items:
            type: string
          description: The tunnel's prefixes this node carries.
        announced:
          type: array
          items:
            type: string
        withdrawn:
          type: array
          items:
            type: object
            properties:
              prefix:
                type: string
              reason:
                type: string
        interface:
          type: string
        mtu:
          type: integer
        mss_clamp:
          type: integer
        problem:
          type: string
          description: Why this node is not delivering the tunnel's prefixes, when it is not.
    TunnelStatus:
      type: object
      required:
      - tunnel_id
      - state
      description: What a node's provisioner says about one return path. Nodes attach these to the heartbeat
        they already send, because a tunnel that went down between two polls is a prefix being black-holed
        until the next one.
      properties:
        tunnel_id:
          type: string
        state:
          type: string
          enum:
          - up
          - down
          - unknown
          description: 'A tunnel reported down withdraws its prefixes from that node. One that has never
            reported does not: absence of a report usually means nothing is reporting, and inferring failure
            from silence would blank the fabric of any operator who has not wired a provisioner up yet.
            Set required on the tunnel to reverse that judgement.'
        detail:
          type: string
          description: Free text from the provisioner, carried through unchanged.
        reported_at:
          type: string
          format: date-time
          description: 'Stamped by the control plane, not the node: the fleet''s clocks are not synchronised.'
    Tenant:
      type: object
      required:
      - name
      - prefixes
      description: A customer of the scrubbing service. It exists so a customer can be given a credential
        that reads their own traffic and nothing else; without it the only way to show someone their analytics
        is to hand them an operator token, which also reads every other customer's prefixes, the fleet's
        topology and the policy behind it.
      properties:
        id:
          type: string
          description: Derived from the name when omitted, so re-sending the same customer updates them
            rather than creating a second record holding half their prefixes.
        name:
          type: string
        prefixes:
          type: array
          items:
            type: string
          minItems: 1
          description: 'What this customer may read. An entitlement covers anything inside it, so a customer
            who brings a /22 and has it protected as four /24s is entitled once rather than on every split.
            Must be written masked: host bits are refused, because the entitlement is matched against
            what was written.'
        contact:
          type: string
          description: Free text for whoever runs the platform. Never matched on.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCredential:
      type: object
      properties:
        tenant_id:
          type: string
        token:
          type: string
          description: Returned once, here, and never served again. Only its hash is kept, so a lost credential
            is rotated rather than recovered; issuing again rotates it and the previous one stops working
            immediately.
    AnalyticsVector:
      type: object
      description: One way traffic was stopped during an attack.
      properties:
        rule_id:
          type: string
        filter_id:
          type: string
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
        shared:
          type: boolean
          description: The rule guards the whole policy rather than this prefix specifically, so its volume
            is not necessarily this customer's.
        flows:
          type: integer
        dropped:
          type: integer
    AnalyticsEvent:
      type: object
      description: One attack against one prefix.
      properties:
        prefix:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the attack is still running. Dated to when the traffic stopped, not
            to the end of the window spent confirming it.
        ongoing:
          type: boolean
        seconds:
          type: number
        peak_pps:
          type: integer
          description: Summed across the fleet. The bursts need not be simultaneous, so this is an upper
            bound on the instantaneous fabric peak rather than a measurement of it.
        peak_dropped_pps:
          type: integer
        dropped:
          type: integer
          description: 'Volume scrubbed over the whole attack, summed over vectors. Not always the same
            number as the prefix''s own dropped total: a rule guarding several prefixes has its volume
            attributed to each of them, and those vectors are marked shared. Read the prefix total when
            the two disagree.'
        flows:
          type: integer
        pulse:
          type: boolean
          description: The burst detector recognised a pulse train, which is why mitigation stayed engaged
            through the quiet stretches.
        vectors:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsVector'
    AnalyticsPoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
        flows:
          type: integer
        flows_dropped:
          type: integer
        offered:
          type: integer
        dropped:
          type: integer
        delivered:
          type: integer
        challenged:
          type: integer
        peak_pps:
          type: integer
          description: 'The heaviest fleet-wide rate inside the interval, not an average over it: an average
            is exactly what a burst attack is shaped to hide.'
        offered_pps:
          type: integer
        dropped_pps:
          type: integer
        pulsing:
          type: boolean
    AnalyticsSummary:
      type: object
      properties:
        prefix:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        flows:
          type: integer
        flows_dropped:
          type: integer
        offered:
          type: integer
        dropped:
          type: integer
        delivered:
          type: integer
          description: What reached the customer. A subtraction rather than its own counter, because the
            datapath only knows what it stopped.
        challenged:
          type: integer
        mitigated_pct:
          type: number
        peak_pps:
          type: integer
        peak_dropped_pps:
          type: integer
        offered_pps:
          type: integer
          description: Where the prefix stands right now, summed across the nodes currently reporting.
            A node that has gone quiet is left out.
        dropped_pps:
          type: integer
        nodes:
          type: integer
          description: Scrubbers currently carrying traffic for this prefix. Under anycast this is the
            fabric absorbing the attack, so one node during a flood is a problem.
        under_attack:
          type: boolean
        pulsing:
          type: boolean
        attacks:
          type: integer
        attack_seconds:
          type: number
    AnalyticsOverview:
      type: object
      properties:
        window:
          type: string
          example: 24h
        resolution:
          type: string
          description: How finely history is bucketed.
        retention:
          type: string
          description: 'How far back history is kept. It is in memory and not durable: it is derived from
            reports that keep arriving, so a restarted control plane rebuilds it within a couple of heartbeats
            rather than carrying stale numbers across the gap.'
        generated:
          type: string
          format: date-time
        tenant:
          type: object
          description: Present only for a tenant credential.
          properties:
            id:
              type: string
            name:
              type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSummary'
    AnalyticsSeries:
      type: object
      properties:
        prefix:
          type: string
        window:
          type: string
        step:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPoint'
    AnalyticsEvents:
      type: object
      properties:
        window:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEvent'
    DeployResult:
      type: object
      properties:
        policy_id:
          type: string
        version:
          type: integer
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        nodes:
          type: integer
        datapath:
          type: string
        ml_ready:
          type: boolean
    Health:
      type: object
      properties:
        status:
          type: string
        product:
          type: string
        datapath:
          type: string
        mode:
          type: string
          enum:
          - primary
          - replica
    SampleBatch:
      type: object
      required:
      - samples
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
          minItems: 1
    TrainRequest:
      type: object
      properties:
        epochs:
          type: integer
          minimum: 1
          description: Default 200.
        lr:
          type: number
          description: Learning rate. Default 0.15.
        threshold:
          type: number
          description: Score at or above which a flow is an attack. Default 0.7.
    DecideRequest:
      type: object
      required:
      - node_id
      - flow
      properties:
        node_id:
          type: string
        flow:
          $ref: '#/components/schemas/Flow'

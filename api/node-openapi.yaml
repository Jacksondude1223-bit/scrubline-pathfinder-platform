openapi: 3.0.3
info:
  title: Scrubline scrub-node agent
  version: 0.2.0
  description: 'The HTTP surface a scrubbing node serves beside its datapath. This is a different service
    from the control plane, on its own port, with its own credential.


    `SCRUBLINE_NODE_API_TOKEN` guards everything here except `/health`. It is deliberately not the operator
    credential and not the node''s control-plane credential: these endpoints are read-only local surfaces
    for a scraper, a BGP speaker and an operator debugging a policy, so compromising one buys none of
    the control plane.


    The agent serves TLS with `-tls-cert`/`-tls-key` and refuses a routable address without it.'
servers:
- url: https://127.0.0.1:9091
  description: A node agent serving TLS
- url: http://127.0.0.1:9091
  description: Loopback without TLS
security:
- nodeAPIToken: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      description: Open, for probes. It carries no policy detail.
      responses:
        '200':
          description: The agent is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealth'
  /metrics:
    get:
      summary: Prometheus exposition for this node's datapath
      description: Per-rule hits, per-stage verdicts, game filter counters, per-prefix traffic and pulse
        shape, the reputation tiers, and the steering posture. It names rule ids, customer prefixes and
        traffic volumes, so it takes the token.
      responses:
        '200':
          description: Exposition in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Only GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The exposition could not be rendered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bgp:
    get:
      summary: What this node should advertise
      description: 'Where a BGP speaker picks up its plan. Scrubline does not speak BGP: it compiles the
        plan, the way it compiles the TCAM, FPGA and ZC programs, and serves it here.


        `?format=exabgp` returns ExaBGP commands as plain text instead of JSON.'
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - exabgp
        description: Return ExaBGP commands as text/plain rather than JSON.
      responses:
        '500':
          description: The text format was asked for and the configuration could not be rendered. It is an error, not an empty body, so a daemon fed from it never mistakes a failure for an empty plan; the JSON form carries the same reason in `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BGPPlan'
            text/plain:
              schema:
                type: string
              example: 'announce route 203.0.113.0/24 next-hop 198.51.100.3 as-path [ 65001 65001 65001
                ]

                withdraw route 203.0.114.10/32 next-hop 198.51.100.3

                '
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Only GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tunnels:
    get:
      summary: The return paths this node should be holding open
      description: 'Where whatever provisions interfaces on this box picks up its work. Scrubline does
        not create interfaces, the same way it does not speak BGP: it compiles the intent and serves it,
        so what the fabric wants can be read and diffed rather than inferred from the state of a machine.


        The fabric is anycast, so this is a fan-out rather than an assignment — every node carrying a
        customer''s prefixes holds its own tunnel to the same customer endpoint, from its own address.


        A tunnel whose direction is both also gets forwarding rules for the customer''s replies coming
        back up it: only sources inside the tunnel''s own prefixes pass, per address family, less any more
        specific prefix of another tunnel inside them (whose customer an address is goes by the most specific
        prefix, as routing does), and their SYNs are MSS-clamped like those going down. A return tunnel
        forwards nothing that comes up it.


        Node-to-node tunnels (`sbh-*`) carry what other nodes scrub for customers pinned to this one, and
        what this one scrubs for customers pinned elsewhere; what arrives over them must be addressed to a
        customer pinned here. The firewall accepts GRE and IPIP only from the addresses in `tunnel_peers`
        and the remote ends of the tunnels in `tunnels` and `backhaul`.


        Every customer tunnel then gets a `tc` token-bucket shaper holding what goes down it to this
        node''s share of the tunnel''s clean-traffic allowance: all of it at a pinned tunnel''s location.


        The rules assume the `inet scrubline` table with `forward` and `input` chains. The provisioner the
        install script sets up beside the agent creates it, applies all of this every few seconds, and
        posts back which tunnels it built.


        `?format=iproute2` returns the configuration as plain text instead of JSON.'
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - iproute2
        description: Return iproute2 and nftables lines as text/plain rather than JSON.
      responses:
        '500':
          description: The text format was asked for and the configuration could not be rendered. It is an error, not an empty body, so a daemon fed from it never mistakes a failure for an empty plan; the JSON form carries the same reason in `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The agent has not had a program from the control plane since it started, so it
            does not know what this node should hold. A provisioner leaves the box as it is rather than
            take this for an empty plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The return paths, their rendered configuration, and what has been reported about
            them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    type: string
                  tunnels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeTunnel'
                  backhaul:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backhaul'
                    description: Node-to-node tunnels for customers pinned to this node or to another.
                  pinned:
                    type: array
                    items:
                      type: string
                    description: Prefixes of the customers pinned to this node.
                  tunnel_peers:
                    type: array
                    items:
                      type: string
                    description: Addresses this node accepts GRE and IPIP from.
                  iproute2:
                    type: array
                    items:
                      type: string
                    description: Everything above as commands, in the order they apply.
                  status:
                    type: array
                    items:
                      $ref: '#/components/schemas/TunnelStatus'
                  error:
                    type: string
                    description: Set when the configuration could not be rendered. The datapath keeps
                      running, but this node may be attracting traffic it cannot deliver.
            text/plain:
              schema:
                type: string
              example: 'ip link add scr-northwind type gre local 192.0.2.1 remote 198.51.100.1 key 42

                ip link set scr-northwind mtu 1472 up

                ip route replace 203.0.113.0/24 dev scr-northwind

                nft add rule inet scrubline forward oifname "scr-northwind" tcp flags syn tcp option maxseg
                size set 1432

                nft add rule inet scrubline forward iifname "scr-northwind" ip saddr != { 203.0.113.0/24 }
                drop

                nft add rule inet scrubline forward iifname "scr-northwind" meta nfproto ipv6 drop

                nft add rule inet scrubline forward iifname "scr-northwind" tcp flags syn tcp option maxseg
                size set 1432

                tc qdisc replace dev scr-northwind root tbf rate 2500000kbit burst 3125000 latency 50ms

                '
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Report what the provisioner actually built
      description: 'The one write this agent accepts. Whatever builds the tunnels says which are carrying
        traffic; the agent forwards that on its next heartbeat, and a tunnel reported down withdraws its
        prefixes from this node.


        A node announcing a prefix whose return path is down is worse than one that never announced it:
        BGP hands over the customer''s traffic and it is dropped. That failure looks healthy from every
        other angle — the datapath counters are fine and the announcements are up — so this report is
        the only thing that catches it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnels:
                  type: array
                  items:
                    $ref: '#/components/schemas/TunnelStatus'
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
        '400':
          description: A status is missing its tunnel id, or names a state that is not up, down or unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sessions:
    get:
      summary: The customer BGP peerings this node terminates
      description: 'For the BGP daemon running beside this agent. Rendered as BIRD rather than as the
        ExaBGP commands /bgp serves, and the split is deliberate: announcing is an imperative act, which
        is what a command pipe is for, while peering with a customer is a standing configuration with
        an import filter and a prefix limit on it.


        The filter accepts the policy''s prefixes and anything more specific inside them. Routes learned
        here do not add themselves to the protected set.


        `?format=bird` returns the configuration as plain text instead of JSON.'
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - bird
        description: Return BIRD configuration as text/plain rather than JSON.
      responses:
        '500':
          description: The text format was asked for and the configuration could not be rendered. It is an error, not an empty body, so a daemon fed from it never mistakes a failure for an empty plan; the JSON form carries the same reason in `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The peerings and their rendered configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    type: string
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  bird:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
            text/plain:
              schema:
                type: string
              example: "protocol bgp cust_northwind {\n    local 192.0.2.1 as 65000;\n    neighbor 198.51.100.1\
                \ as 64512;\n}\n"
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Only GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /egress:
    post:
      summary: Report traffic the protected service sent back to a client
      description: 'A separate endpoint from /decide because a reply is not being judged — nothing about
        it is permitted or dropped. It is evidence, and the only evidence this fabric has that an attacker
        cannot write himself: the origin chose to answer that address.


        Sustained return traffic to a client confirms it, with no protocol knowledge involved. That is
        the strongest signal available for a protocol with no challenge to issue — and still weaker than
        a challenge, because an attacker can arrange it by spoofing a victim''s address into a service
        that replies to anything.


        The flow is the reply: its source is the protected address and its destination is the client.
        A reply whose source is not a prefix this node carries is ignored.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Flow'
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  observed:
                    type: boolean
        '400':
          description: The flow will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Only POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reputation:
    get:
      summary: What this node remembers about sources
      description: 'Two tiers. A source that cleared a protocol gate takes a shorter path for a while:
        it skips the gate and the classifier, because clearing the gate already established what they
        would say. It does not skip the behavioural cap or the signature check — the cap because it is
        the only thing bounding what a verified source can send, and the signature because the source
        address on a packet is written by whoever sent it.


        A source that keeps failing goes the other way, into a penalty box with an escalating term, and
        is dropped at the top of the pipeline rather than walking every stage to the same verdict. During
        an attack most of the packets are the attacker''s, so that is where the headroom comes from.'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
        description: How many sources to list. Penalised ones come first.
      responses:
        '200':
          description: The cache's counters and a page of the sources in it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    type: string
                  stats:
                    $ref: '#/components/schemas/ReputationStats'
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceReputation'
        '400':
          description: limit is not a positive number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Take sources out of the penalty box
      description: 'How an operator clears a false positive. A boxed source cannot promote itself out
        — it is dropped before it reaches a gate — so without this a bad call would stand for the whole
        penalty.


        The escalation level is left alone: the next offence should not start from scratch because this
        one was forgiven.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                release:
                  type: array
                  items:
                    type: string
                  description: Source addresses to free.
      responses:
        '200':
          description: How many of them were actually in the box.
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: integer
        '400':
          description: No sources given, or a malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /decide:
    post:
      summary: Run a flow record through this node's datapath
      description: 'Evaluates in the node''s own pipeline, against the program it currently holds, with
        its own rate and session state. Unlike the control plane''s /v1/decide this is the state real
        traffic is being judged against, so repeated calls accumulate and can trip a behavioural cap or
        clear a game filter''s gate.


        A flow may carry a base64 payload; without one the game filter reports it uninspectable and never
        drops it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Flow'
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: The flow will not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Only POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    nodeAPIToken:
      type: http
      scheme: bearer
      description: SCRUBLINE_NODE_API_TOKEN. Guards this agent's local endpoints only.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: What went wrong, in a sentence an operator can act on.
    Flow:
      type: object
      description: One flow record.
      properties:
        src_ip:
          type: string
        dst_ip:
          type: string
        proto:
          type: string
          enum:
          - tcp
          - udp
          - icmp
        sport:
          type: integer
          minimum: 0
          maximum: 65535
        dport:
          type: integer
          minimum: 0
          maximum: 65535
        flags:
          type: string
          example: syn
        pps:
          type: integer
          minimum: 0
          description: The flow's observed packet rate.
        bps:
          type: integer
          minimum: 0
          description: The flow's observed bit rate, when the record carries one. Without it the node counts
            the packets' headers and the payload, for an on-demand tunnel's bandwidth threshold.
        payload:
          type: string
          format: byte
          description: 'Packet bytes, base64. Only the ZC stage sees it. Without one the game filter reports
            the packet uninspectable and never drops it: it refuses to judge what it was not given.'
    Decision:
      type: object
      properties:
        action:
          type: string
          enum:
          - drop
          - permit
          - rate_limit
          - inspect
          - count
          - challenge
          description: challenge means this packet is dropped and reply is emitted to the source.
        stage:
          type: string
          enum:
          - asic
          - fpga
          - zc
        rule_id:
          type: string
        reason:
          type: string
        node_id:
          type: string
        score:
          type: number
          description: Classifier score, when the ZC model decided.
        filter:
          type: string
          description: The game filter that decided, when one did.
        reply:
          type: string
          format: byte
          description: Bytes the datapath sends back to the source. Set only on a challenge.
    Announcement:
      type: object
      properties:
        prefix:
          type: string
        node_id:
          type: string
        node_name:
          type: string
        region:
          type: string
        state:
          type: string
          enum:
          - announce
          - withdraw
        prepends:
          type: integer
          description: AS-path padding. Higher means the node is a less attractive path and takes less
            of the prefix's traffic.
        communities:
          type: array
          items:
            type: string
        next_hop:
          type: string
          description: The address the node announces its routes towards. The text form leaves it off
            a route of the other address family, which a peer without extended next hops would refuse.
        reason:
          type: string
    NodeHealth:
      type: object
      properties:
        node:
          type: string
        name:
          type: string
        datapath:
          type: string
    BGPPlan:
      type: object
      properties:
        node:
          type: string
        local_as:
          type: integer
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        exabgp:
          type: array
          items:
            type: string
          description: The plan rendered as ExaBGP commands.
        error:
          type: string
          description: Set when the plan could not be rendered. The datapath keeps running, but this node
            is advertising something other than what the control plane decided.
    Backhaul:
      type: object
      description: A node-to-node GRE tunnel, over which a node helping another forwards the clean traffic
        it scrubs for a customer pinned there.
      properties:
        peer:
          type: string
        interface:
          type: string
          example: sbh-b981c02c78d
        local:
          type: string
        remote:
          type: string
        mtu:
          type: integer
        mss_clamp:
          type: integer
        prefixes:
          type: array
          items:
            type: string
          description: What is routed into it. Empty on the location's end, which only receives.
    NodeTunnel:
      type: object
      description: One node's instance of a policy Tunnel, with the local end filled in and the derived
        values resolved, so the agent renders configuration rather than recomputing policy.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - gre
          - ipip
        local:
          type: string
          description: This node's tunnel_src.
        remote:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: The tunnel's prefixes that this node actually carries.
        mtu:
          type: integer
        mss_clamp:
          type: integer
        key:
          type: integer
        required:
          type: boolean
        interface:
          type: string
          example: scr-northwind
          description: The link name this compiles to, inside the kernel's 15-character limit.
        comment:
          type: string
        direction:
          type: string
          enum:
          - both
          - return
          description: Absent or empty means both. A return tunnel forwards nothing that comes up it.
        sources:
          type: array
          items:
            type: string
          description: Every prefix of the tunnel, including ones steered away from this node; replies
            coming back up it may be sourced from any of them.
        foreign:
          type: array
          items:
            type: string
          description: Other tunnels' prefixes inside this tunnel's, across the whole policy, which
            replies coming back up it may not be sourced from.
        rate_kbps:
          type: integer
          description: This node's share of the tunnel's clean-traffic allowance, in kbit/s, which the
            rendered tc shaper holds it to.
        mitigation:
          type: string
          enum:
          - on_demand
          description: Present when the agent only watches the tunnel's traffic until it reaches attack_pps
            or attack_kbps, and filters it from then on until it has stayed under both for five minutes,
            twice as long for each mitigation that starts within an hour of the last one ending, up to an
            hour. A game filter's HTTP rules judge it throughout.
        attack_pps:
          type: integer
          description: This node's share of the tunnel's packet-rate threshold.
        attack_kbps:
          type: integer
          description: This node's share of the tunnel's bandwidth threshold, in kbit/s.
    Session:
      type: object
      required:
      - id
      - peer_ip
      - peer_as
      - prefixes
      description: 'A BGP peering with a customer, for customers who announce their own prefixes rather
        than having them typed into a policy. What the session may carry is still declared here: a route
        learned from a customer does not add itself to the protected set, or a peer that leaked a supernet
        would have the fabric announcing address space it was never asked to protect.'
      properties:
        id:
          type: string
          description: Lowercase letters, digits, dashes and underscores. Becomes the peering's name in
            the rendered configuration.
        peer_ip:
          type: string
          example: 198.51.100.1
        peer_as:
          type: integer
          minimum: 1
          maximum: 4294967295
        local_as:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The AS the fabric peers from. Zero takes the node's own; a session with neither
            is refused rather than coming up announcing from whatever the daemon happened to hold.
        prefixes:
          type: array
          items:
            type: string
          minItems: 1
          description: What the session accepts, each one the policy protects. The rendered filter admits
            these and anything more specific inside them, because customers de-aggregate under attack
            and a filter that refused that would drop the announcement when it mattered most.
        max_prefixes:
          type: integer
          minimum: 0
          description: Tears the session down past this many accepted routes. Zero derives a limit with
            headroom over the filter — a backstop against a leak, not an inventory.
        password:
          type: string
          description: 'TCP-MD5 secret, shipped only to the nodes terminating this session. Printable
            ASCII without spaces, quotes or backslashes: it is written into a routing daemon''s configuration,
            so a value that could close its string is refused rather than quoted.'
        multihop:
          type: integer
          minimum: 0
          maximum: 255
          description: TTL for a peer that is not directly attached.
        passive:
          type: boolean
          description: Wait for the customer to connect rather than dialling them.
        nodes:
          type: array
          items:
            type: string
          description: Node ids or names that terminate this session.
        regions:
          type: array
          items:
            type: string
          description: 'Regions that terminate it. Empty nodes and regions means every node, which is
            rarely wanted: a customer peers where they have a path, not with the whole fabric.'
        comment:
          type: string
    TunnelStatus:
      type: object
      required:
      - tunnel_id
      - state
      description: What a node's provisioner says about one return path. Nodes attach these to the heartbeat
        they already send, because a tunnel that went down between two polls is a prefix being black-holed
        until the next one.
      properties:
        tunnel_id:
          type: string
        state:
          type: string
          enum:
          - up
          - down
          - unknown
          description: 'A tunnel reported down withdraws its prefixes from that node. One that has never
            reported does not: absence of a report usually means nothing is reporting, and inferring failure
            from silence would blank the fabric of any operator who has not wired a provisioner up yet.
            Set required on the tunnel to reverse that judgement.'
        detail:
          type: string
          description: Free text from the provisioner, carried through unchanged.
        reported_at:
          type: string
          format: date-time
          description: 'Stamped by the control plane, not the node: the fleet''s clocks are not synchronised.'
    ReputationStats:
      type: object
      description: The two-tier source cache's counters.
      properties:
        tracked:
          type: integer
        max:
          type: integer
          description: At the bound a source takes the ordinary path, so this costs an optimisation rather
            than a protection.
        trusted:
          type: integer
        penalised:
          type: integer
        fast_passed:
          type: integer
          description: Packets taken off the slow path because their source was already verified.
        boxed:
          type: integer
          description: 'Packets dropped at the top because their source is in the box: the load the rest
            of the stages did not carry.'
        promotions:
          type: integer
        demotions:
          type: integer
        strikes:
          type: integer
        shielded:
          type: integer
          description: Strikes that landed on an already-verified source and were not acted on. Source
            addresses are attacker-controlled, so acting on one would let anyone get a real player banned.
            A rising value is a spoofing attempt or a misbehaving verified client, and both want a human.
        full:
          type: integer
        freed:
          type: integer
          description: Boxed sources released because their address answered for itself, the origin
            replying to them at length or a challenge answered. Each was a penalty cutting off a real
            client.
    SourceReputation:
      type: object
      description: What the datapath remembers about one source address.
      properties:
        source:
          type: string
        state:
          type: string
          enum:
          - trusted
          - penalised
          - tracked
        proof:
          type: string
          enum:
          - challenge
          - handshake
          - none
          description: challenge proves the address answers for itself; handshake only proves the source
            speaks the protocol, since an opening sequence can be sent blind.
        expires_in_seconds:
          type: number
        level:
          type: integer
          description: 'How far up the penalty ladder this source has climbed: 1 minute, then 10, then
            an hour. It decays after an hour of clean time measured from the end of the last penalty,
            so time served does not count as good behaviour.'
        strikes:
          type: integer

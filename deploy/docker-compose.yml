services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: dev-scrubline-token
    ports:
      - "8080:8080"
    command: ["scrub-api", "-addr", "0.0.0.0:8080"]
  node-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: dev-scrubline-token
    command: ["scrub-node", "-api", "http://api:8080", "-name", "scrub-a", "-region", "iad", "-capacity", "100", "-listen", "0.0.0.0:9091"]
    depends_on: [api]
  node-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: dev-scrubline-token
    command: ["scrub-node", "-api", "http://api:8080", "-name", "scrub-b", "-region", "fra", "-capacity", "80", "-listen", "0.0.0.0:9091"]
    depends_on: [api]
  node-c:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: dev-scrubline-token
    command: ["scrub-node", "-api", "http://api:8080", "-name", "scrub-c", "-region", "sin", "-capacity", "40", "-listen", "0.0.0.0:9091"]
    depends_on: [api]

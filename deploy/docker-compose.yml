# A single-host demo fabric: a control plane, three scrubbers, a seeder that
# deploys a policy and onboards two customers, and a generator that drives
# traffic through the nodes so the analytics have something to report.
#
# Credentials come from the environment. deploy/.env.example has a set for
# local use; copy it to deploy/.env and compose will pick it up.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: ${SCRUBLINE_API_TOKEN:?set SCRUBLINE_API_TOKEN in the environment}
      SCRUBLINE_ENROLL_TOKEN: ${SCRUBLINE_ENROLL_TOKEN:?set SCRUBLINE_ENROLL_TOKEN in the environment}
    # Bound to loopback on purpose. Exposing this on a routable address means
    # exposing a control plane that is running without TLS, so put a tunnel or
    # a terminating proxy in front rather than changing this to 0.0.0.0.
    # deploy/README.md has both routes.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    # -insecure is for this single-host demo only. The compose network is not
    # loopback, so without it the control plane refuses to serve in the clear.
    # In a deployment, mount a certificate and pass -tls-cert/-tls-key.
    command: ["scrub-api", "-addr", "0.0.0.0:8080", "-insecure", "-state", "/var/lib/scrubline/state.json"]
    volumes:
      - api-state:/var/lib/scrubline
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  # Each node listens on 9091 inside its own container, so the three differ only
  # in the published host port, matching the single-host example in the README.
  # /decide on a node takes the same bearer token as the control API; /health is
  # open so the container healthcheck and any probe can reach it.
  #
  # Plain depends_on only waits for the container to start, not for the API to
  # listen, so the agent raced the control plane on startup.
  node-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_ENROLL_TOKEN: ${SCRUBLINE_ENROLL_TOKEN:?set SCRUBLINE_ENROLL_TOKEN in the environment}
      SCRUBLINE_NODE_API_TOKEN: ${SCRUBLINE_NODE_API_TOKEN:?set SCRUBLINE_NODE_API_TOKEN in the environment}
    command: ["scrub-node", "-insecure", "-api", "http://api:8080", "-name", "scrub-a", "-advertise", "node-a:9091", "-tunnel-src", "192.0.2.1", "-local-as", "65000", "-region", "iad", "-capacity", "100", "-capacity-pps", "4000000", "-listen", "0.0.0.0:9091"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9091:9091"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9091/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  node-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_ENROLL_TOKEN: ${SCRUBLINE_ENROLL_TOKEN:?set SCRUBLINE_ENROLL_TOKEN in the environment}
      SCRUBLINE_NODE_API_TOKEN: ${SCRUBLINE_NODE_API_TOKEN:?set SCRUBLINE_NODE_API_TOKEN in the environment}
    command: ["scrub-node", "-insecure", "-api", "http://api:8080", "-name", "scrub-b", "-advertise", "node-b:9091", "-tunnel-src", "192.0.2.2", "-local-as", "65000", "-region", "fra", "-capacity", "80", "-capacity-pps", "3000000", "-listen", "0.0.0.0:9091"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9092:9091"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9091/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  node-c:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_ENROLL_TOKEN: ${SCRUBLINE_ENROLL_TOKEN:?set SCRUBLINE_ENROLL_TOKEN in the environment}
      SCRUBLINE_NODE_API_TOKEN: ${SCRUBLINE_NODE_API_TOKEN:?set SCRUBLINE_NODE_API_TOKEN in the environment}
    command: ["scrub-node", "-insecure", "-api", "http://api:8080", "-name", "scrub-c", "-advertise", "node-c:9091", "-tunnel-src", "192.0.2.3", "-local-as", "65000", "-region", "sin", "-capacity", "40", "-capacity-pps", "1500000", "-listen", "0.0.0.0:9091"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9093:9091"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:9091/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  # Runs once and exits. It deploys the policy and onboards the two customers,
  # then prints their credentials — "docker compose logs seed" brings them back
  # if the startup output has scrolled away.
  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: ${SCRUBLINE_API_TOKEN:?set SCRUBLINE_API_TOKEN in the environment}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
    entrypoint: ["seed.sh"]
    volumes:
      - api-state:/var/lib/scrubline
    depends_on:
      api:
        condition: service_healthy
      node-a:
        condition: service_healthy
    restart: "no"

  # Without this the whole stack comes up reporting zeros, which is not
  # distinguishable from a stack that is broken. It posts flow records to each
  # agent's /decide, which runs them through the real pipeline; the counters
  # that produces ride the heartbeat and surface as analytics.
  traffic:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_NODE_API_TOKEN: ${SCRUBLINE_NODE_API_TOKEN:?set SCRUBLINE_NODE_API_TOKEN in the environment}
    entrypoint: ["scrub-traffic"]
    command: ["-nodes", "http://node-a:9091,http://node-b:9091,http://node-c:9091"]
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  api-state:

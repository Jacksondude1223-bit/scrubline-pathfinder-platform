services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: ${SCRUBLINE_API_TOKEN:?set SCRUBLINE_API_TOKEN in the environment}
    ports:
      - "8080:8080"
    command: ["scrub-api", "-addr", "0.0.0.0:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  # Each node listens on 9091 inside its own container, so the three differ only
  # in the published host port, matching the single-host example in the README.
  # /decide on a node takes the same bearer token as the control API; /health is
  # open so the container healthcheck and any probe can reach it.
  #
  # Plain depends_on only waits for the container to start, not for the API to
  # listen, so the agent raced the control plane on startup.
  node-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: ${SCRUBLINE_API_TOKEN:?set SCRUBLINE_API_TOKEN in the environment}
    command: ["scrub-node", "-api", "http://api:8080", "-name", "scrub-a", "-advertise", "node-a:9091", "-region", "iad", "-capacity", "100", "-listen", "0.0.0.0:9091"]
    ports:
      - "9091:9091"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  node-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: ${SCRUBLINE_API_TOKEN:?set SCRUBLINE_API_TOKEN in the environment}
    command: ["scrub-node", "-api", "http://api:8080", "-name", "scrub-b", "-advertise", "node-b:9091", "-region", "fra", "-capacity", "80", "-listen", "0.0.0.0:9091"]
    ports:
      - "9092:9091"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  node-c:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SCRUBLINE_API_TOKEN: ${SCRUBLINE_API_TOKEN:?set SCRUBLINE_API_TOKEN in the environment}
    command: ["scrub-node", "-api", "http://api:8080", "-name", "scrub-c", "-advertise", "node-c:9091", "-region", "sin", "-capacity", "40", "-listen", "0.0.0.0:9091"]
    ports:
      - "9093:9091"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
